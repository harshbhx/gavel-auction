name: judge-smoke
# Nightly smoke of the judge journey against the public site (R-QA-055, T-QA-049). It reuses the
# live red-team walk (qa/live-redteam/run.mjs) in SMOKE mode: open /try, start a demo room, open
# the hub, join by code and from the hub link, register with the demo hold, bid from two
# bidders, close the lot, open the screen and the receipt. One room per run. Every step is
# listed in the job summary with PASS or FAIL, screenshots are uploaded, and the job FAILS when
# any step fails, so a green run means the journey worked.
# Sandbox only: the demo hold needs no PayPal buyer secrets and none are passed here.
on:
  schedule:
    - cron: '45 21 * * *'
  workflow_dispatch:
    inputs:
      web_url:
        description: 'Origin of the web app to smoke (default: the public domain)'
        required: false
        default: 'https://gavel.dualmindlab.tech'
        type: string
      api_url:
        description: 'Origin of the API (default: the public API domain)'
        required: false
        default: 'https://api.gavel.dualmindlab.tech'
        type: string

permissions:
  contents: read

concurrency:
  group: judge-smoke
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  judge:
    if: ${{ github.repository == 'harshbhx/gavel-auction' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_URL: ${{ inputs.web_url || 'https://gavel.dualmindlab.tech' }}
      API_URL: ${{ inputs.api_url || 'https://api.gavel.dualmindlab.tech' }}
      PROFILE: desktop
      SMOKE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check the inputs
        run: |
          for pair in "web_url=$WEB_URL" "api_url=$API_URL"; do
            value="${pair#*=}"
            if ! printf '%s' "$value" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$'; then
              echo "::error title=Bad input::${pair%%=*} must be an https origin with no path"
              exit 1
            fi
          done
      - name: Wake the API
        run: curl -fsS -o /dev/null --max-time 30 --retry 6 --retry-delay 10 --retry-all-errors "${API_URL%/}/healthz"
      - name: Install Playwright and chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cp qa/live-redteam/run.mjs "$RUNNER_TEMP/pw/run.mjs"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Walk the judge journey
        run: |
          cd "$RUNNER_TEMP/pw"
          OUT="$GITHUB_WORKSPACE/smoke-out" node run.mjs
      - name: Job summary
        if: always()
        run: |
          if [ -f "smoke-out/summary-$PROFILE.md" ]; then cat "smoke-out/summary-$PROFILE.md" >> "$GITHUB_STEP_SUMMARY"; else echo "### FAILED: no summary produced, nothing was verified" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload screenshots, video, logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: judge-smoke-desktop
          path: smoke-out
          if-no-files-found: warn
          retention-days: 14
