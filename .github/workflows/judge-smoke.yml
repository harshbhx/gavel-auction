name: judge-smoke
# Nightly judge walkthrough against the hosted site (R-QA-055, T-QA-049). Runs the
# judge-walkthrough spec in Chromium with GAVEL_JUDGE_URL set to the production web URL; the
# spec must finish within 300 s. The repository variable JUDGE_URL (Settings, Secrets and
# variables, Actions, Variables) must hold the public web origin, for example
# https://gavel.pages.dev. A run with JUDGE_URL empty or missing FAILS, so a nightly that tested
# nothing can never look like a pass. Set JUDGE_URL as soon as the hosted web app exists.
on:
  schedule:
    - cron: '45 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  judge:
    if: ${{ github.repository == 'harshbhx/gavel-auction' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GAVEL_JUDGE_URL: ${{ vars.JUDGE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check configuration
        run: |
          if [ -z "$GAVEL_JUDGE_URL" ]; then
            echo "::error title=Judge smoke did not run::The repository variable JUDGE_URL is not set. Set it to the public web URL of the hosted site."
            echo "### FAILED: no JUDGE_URL, nothing was tested" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: ./.github/actions/setup
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the walkthrough
        working-directory: packages/e2e
        run: npx playwright test specs/judge-walkthrough.spec.ts --project=chromium -g hosted
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ failure() }}
        with:
          name: judge-smoke-traces
          path: packages/e2e/test-results
          retention-days: 7
