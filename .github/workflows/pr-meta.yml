name: pr-meta
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-meta-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Runs the validator from the base branch; the pull request code is never checked out.
# The branch name and title are attacker-controlled text, so they are only written to the job
# log and never to a comment; the failed check is the signal.
jobs:
  branch-and-title:
    # Dependabot branches and titles follow its own format (see .github/dependabot.yml).
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version-file: .nvmrc
      - name: Validate
        id: check
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set +e
          node scripts/check-branch-pr.mjs > "$RUNNER_TEMP/pr-meta.md"
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/pr-meta.md"
      - name: Fail
        if: steps.check.outputs.status != '0'
        run: exit 1
