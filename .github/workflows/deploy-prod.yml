name: deploy-prod
# Production deploy of the API and WebSocket host (R-QA-042, R-QA-049).
# Runs on a v* tag or by hand. The job uses the `production` environment, which carries the
# required reviewer, so nothing deploys until a reviewer approves it.
# Rollback: dispatch with rollback=true; the job redeploys the deploy that was live before the
# current one, using the Render API. A deploy run builds only the head of main: it stops early when
# the tagged or dispatched commit is not that head, waits until /version serves it and rolls back
# to the previously live deploy when it never does. See infra/rollback.md.
# Needs, in environment production: secrets RENDER_API_KEY and RENDER_DEPLOY_HOOK_URL, variables
# RENDER_SERVICE_ID and PRODUCTION_URL. Without them the job ends green with a notice.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      rollback:
        description: 'Redeploy the previous live deploy instead of building a new one'
        type: boolean
        default: false
      rollback_deploy_id:
        description: 'Rollback only: Render deploy id to restore (default: the newest older deploy with another commit)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    if: ${{ github.repository == 'harshbhx/gavel-auction' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require the head of main
        if: ${{ !inputs.rollback }}
        run: |
          # The deploy hook builds the branch head, so any other commit would ship code that was not
          # tagged or reviewed. Stop before anything is changed.
          head="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)"
          if [ -z "$head" ] || [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error title=Not main head::$GITHUB_SHA is not the head of main (${head:-unknown}); tag or dispatch from the current head"
            exit 1
          fi
      - name: Check configuration
        id: cfg
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          missing=""
          [ -n "$RENDER_API_KEY" ] || missing="$missing secret:RENDER_API_KEY"
          [ -n "$RENDER_DEPLOY_HOOK_URL" ] || missing="$missing secret:RENDER_DEPLOY_HOOK_URL"
          [ -n "$RENDER_SERVICE_ID" ] || missing="$missing variable:RENDER_SERVICE_ID"
          [ -n "$PRODUCTION_URL" ] || missing="$missing variable:PRODUCTION_URL"
          if [ -n "$missing" ]; then
            echo "::notice title=Deploy skipped::Not configured, add to environment production:$missing (see infra/rollback.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Record the live deploy before changing anything
        if: steps.cfg.outputs.ready == 'true'
        id: before
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          ROLLBACK_ID: ${{ inputs.rollback_deploy_id }}
        run: |
          list="$(curl -sS --max-time 30 -H "authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20")"
          live="$(printf '%s' "$list" | jq -r '[.[].deploy | select(.status == "live")] | .[0].id // empty')"
          livecommit="$(printf '%s' "$list" | jq -r '[.[].deploy | select(.status == "live")] | .[0].commit.id // empty')"
          livetrigger="$(printf '%s' "$list" | jq -r '[.[].deploy | select(.status == "live")] | .[0].trigger // empty')"
          # The restore target is the newest deactivated deploy built from another commit than the
          # live one. After a rollback the deactivated list starts with the bad build, so a second
          # rollback needs the id passed in by hand instead of guessing.
          previous="$(printf '%s' "$list" | jq -r --arg lc "$livecommit" \
            '[.[].deploy | select(.status == "deactivated" and (.commit.id // "") != $lc)] | .[0].id // empty')"
          if [ -n "$ROLLBACK_ID" ]; then
            case "$ROLLBACK_ID" in *[!0-9A-Za-z_-]*) echo "::error::rollback_deploy_id has unexpected characters"; exit 1 ;; esac
            previous="$ROLLBACK_ID"
          fi
          previouscommit="$(printf '%s' "$list" | jq -r --arg id "$previous" \
            '[.[].deploy | select(.id == $id)] | .[0].commit.id // empty')"
          echo "live=$live" >> "$GITHUB_OUTPUT"
          echo "livetrigger=$livetrigger" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "previouscommit=$previouscommit" >> "$GITHUB_OUTPUT"
          echo "Live deploy before this run: ${live:-none}; previous: ${previous:-none}" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy the new build
        if: steps.cfg.outputs.ready == 'true' && !inputs.rollback
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$RENDER_DEPLOY_HOOK_URL" || true)"
          case "$code" in
            2??) echo "Render accepted the deploy ($code)" ;;
            *) echo "::error title=Deploy hook::Render answered $code"; exit 1 ;;
          esac
      - name: Roll back to the previous deploy
        if: steps.cfg.outputs.ready == 'true' && inputs.rollback
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          PREVIOUS: ${{ steps.before.outputs.previous }}
          LIVE_TRIGGER: ${{ steps.before.outputs.livetrigger }}
          EXPLICIT: ${{ inputs.rollback_deploy_id }}
        run: |
          if [ -z "$PREVIOUS" ]; then
            echo "::error title=Rollback::no previous deploy is recorded for this service"
            exit 1
          fi
          if [ "$LIVE_TRIGGER" = "rollback" ] && [ -z "$EXPLICIT" ]; then
            echo "::error title=Rollback::the live deploy is already a rollback; pass rollback_deploy_id so the bad build is not redeployed"
            exit 1
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST \
            -H "authorization: Bearer $RENDER_API_KEY" -H 'content-type: application/json' \
            --data "{\"deployId\":\"$PREVIOUS\"}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/rollback" || true)"
          case "$code" in
            2??) echo "Rolled back to $PREVIOUS ($code)" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error title=Rollback::Render answered $code"; exit 1 ;;
          esac
      - name: Wait for the expected version and smoke
        if: steps.cfg.outputs.ready == 'true'
        id: verify
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          SMOKE_RETRIES: '60'
          ROLLBACK: ${{ inputs.rollback }}
          TARGET_COMMIT: ${{ steps.before.outputs.previouscommit }}
        run: |
          # The old instance can answer before the new build is live, so wait for the served sha
          # to equal the expected commit instead of sleeping.
          if [ "$ROLLBACK" = "true" ]; then expected="$TARGET_COMMIT"; else expected="$GITHUB_SHA"; fi
          if [ -z "$expected" ]; then
            echo "::error title=Version::no expected commit is known"
            exit 1
          fi
          bash scripts/wait-version.sh "$PRODUCTION_URL" "$expected" 900
          scripts/smoke.sh "$PRODUCTION_URL"
          sha="$(curl -sS --max-time 15 "${PRODUCTION_URL%/}/version" | jq -r '.sha // empty')"
          echo "Production now serves sha: ${sha:-unknown}" >> "$GITHUB_STEP_SUMMARY"
      - name: Roll back automatically after a failed deploy
        if: ${{ failure() && steps.verify.outcome == 'failure' && !inputs.rollback && steps.before.outputs.live != '' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          LIVE: ${{ steps.before.outputs.live }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST \
            -H "authorization: Bearer $RENDER_API_KEY" -H 'content-type: application/json' \
            --data "{\"deployId\":\"$LIVE\"}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/rollback" || true)"
          case "$code" in
            2??) echo "The new build did not serve $GITHUB_SHA; restored deploy $LIVE ($code)" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error title=Auto rollback::Render answered $code, restore deploy $LIVE by hand"; exit 1 ;;
          esac
