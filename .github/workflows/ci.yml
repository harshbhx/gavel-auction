name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job here is real: an npm script that is not implemented exits 1 instead of passing.
# The browser end-to-end job is absent until packages/e2e has a Playwright suite; it joins the
# `required` list in the change that adds it.
jobs:
  # Decides whether the change touches anything but documentation. A pull request that only
  # changes documentation skips the build, test and type jobs; every cheap check (format, docs
  # format, commit messages, ownership, secrets, banned words, tool tests) still runs, and the
  # `required` roll-up always runs. Pushes to main always run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Rename detection is off inside the script, so a move into docs lists both paths.
          node scripts/classify-change.mjs "$BASE_SHA" >> "$GITHUB_OUTPUT"
          if grep -q 'code=false' "$GITHUB_OUTPUT"; then
            echo "Documentation-only change: build, test and type jobs are skipped."
          fi
  typecheck:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: npm run typecheck
  lint:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: npm run lint
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: npm run format:check
  unit:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: npm test
  coverage:
    needs: [changes, format-check, commitlint]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: npm run test:coverage
      - name: Thresholds may only be raised
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/check-coverage.mjs --ratchet "origin/${{ github.base_ref }}"
  property:
    needs: [changes, format-check, commitlint]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: npm run test:property
  scenarios:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: npm run test:scenarios
  deps:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: npm run check:deps
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Fail on tracked node_modules paths
        run: node scripts/check-no-tracked-node-modules.mjs
      - name: Fail on live host references
        run: npm run check:live-host
      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - run: node scripts/check-bundle-secrets.mjs --self-test
      - name: Build the web bundle with canary secrets and scan it
        run: npm run check:secrets
        env:
          VITE_SANDBOX: 'true'
          PAYPAL_CLIENT_SECRET: canary-paypal-client-secret-4f9c2a71
          PAYPAL_WEBHOOK_ID: canary-paypal-webhook-id-4f9c2a71
          DEEPGRAM_API_KEY: canary-deepgram-api-key-4f9c2a71
          GROQ_API_KEY: canary-groq-api-key-4f9c2a71
          LLM_API_KEY: canary-llm-api-key-4f9c2a71
          ADMIN_KEY: canary-admin-key-4f9c2a71
          TOKEN_SECRET: canary-token-secret-4f9c2a71
          DATABASE_URL: canary-database-url-4f9c2a71
  ascii-banned:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: npm run check:ascii
      # The word list is a secret, so the scanner that sees it must not be code from the pull
      # request. It runs from the base commit and reads the pull request tree as data.
      - name: Check out the trusted scanner (base commit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Banned words
        run: node trusted/scripts/check-banned-words.mjs --root .
        env:
          BANNED_WORDS: ${{ secrets.BANNED_WORDS }}
          # Pull requests from forks never receive the secret; the same check runs on main. The secret is
          # repository-level, so a pull request from this repository whose workflow file is changed can
          # read it; it holds only the banned-word list, not a credential.
          BANNED_WORDS_ALLOW_EMPTY: ${{ github.event.pull_request.head.repo.fork == true }}
      # Commit messages (body and trailers), the pull request title and description and the branch
      # name are checked too, because they reach the public history. The text is passed through
      # the environment and never interpolated into the command line.
      - name: Banned words in commit messages and pull request text
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          node trusted/scripts/check-banned-words.mjs --root .
          --text PR_TITLE --text PR_BODY --text BRANCH_NAME
          --git-log "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
        env:
          BANNED_WORDS: ${{ secrets.BANNED_WORDS }}
          BANNED_WORDS_ALLOW_EMPTY: ${{ github.event.pull_request.head.repo.fork == true }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
      # A squash merge builds a new message; it is checked here, after the merge, as well.
      - name: Banned words in the pushed commit message
        if: ${{ github.event_name == 'push' }}
        run: node trusted/scripts/check-banned-words.mjs --root . --git-log "-1 ${{ github.sha }}"
        env:
          BANNED_WORDS: ${{ secrets.BANNED_WORDS }}
  docs-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - run: node scripts/check-docs-format.mjs --self-test
      - run: node scripts/check-docs-format.mjs
      - run: node scripts/check-gates-result.mjs
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint commit messages
        if: ${{ github.event_name == 'pull_request' && hashFiles('commitlint.config.*') != '' }}
        run: npx commitlint --from "origin/${{ github.base_ref }}" --to HEAD
      # The squash subject on main is the PR title, so its length is the one rule worth enforcing
      # there (the key-first rule is checked by pr-meta). The text arrives through the environment.
      - name: Pull request title length
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          len="${#PR_TITLE}"
          if [ "$len" -gt 72 ]; then
            echo "::error title=PR title too long::The pull request title is $len characters; the limit is 72 (it becomes the squash commit subject)."
            exit 1
          fi
          echo "title length $len ok"
  ownership:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - run: npm run check:ownership
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: origin/${{ github.base_ref }}
  voice:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'
      - name: Python parser golden is up to date
        run: python3 packages/voice/scripts/export-golden.py --check
      - name: Held-out set guard against the base branch
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          npm run check:heldout -w @gavel/voice -- --base "origin/$BASE_REF"
      - name: Vendor key scan of the voice package
        run: npm run scan:secrets -w @gavel/voice
      - name: Bundle size limit
        run: npm run size -w @gavel/voice
  e2e-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Synthesize audio fixtures
        run: node packages/e2e/fixtures/audio/generate.mjs
      - name: Validate fixtures
        run: node scripts/check-fixtures.mjs
  reference-python:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'
      - run: pip install pytest hypothesis
      - run: pytest -q
        working-directory: reference/python
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup
      - name: Export 2000 scenarios from the Python reference with the pinned seed
        run: python3 reference/python/scenario_export.py --seed 20261104 --n 2000 > "$RUNNER_TEMP/scenarios.jsonl"
      - name: Compare the TypeScript engine on the pinned seed
        env:
          GAVEL_DIFFERENTIAL_FILE: ${{ runner.temp }}/scenarios.jsonl
        run: npx vitest run --project 'unit:engine' differential
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: npm run test:tools
  # The OpenAPI document (openapi/gavel.yaml): linted with Redocly, and the route test in
  # `tools` keeps it in step with the server router. Cheap, so it runs on every change.
  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version-file: .nvmrc
      - name: Lint the OpenAPI document
        run: npx --yes @redocly/cli@2.76.0 lint openapi/gavel.yaml --config openapi/redocly.yaml --format stylish
      - name: Spec and router list the same routes
        run: node --test scripts/tests/openapi-routes.test.mjs
  package-checks:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      # Package-level guards that the root lint does not read: each package's own lint (the
      # engine import ban and the voice clock-free and import zones), the engine import check,
      # and the trace baselines. The held-out guard runs in the voice job (it needs the base ref).
      - name: Engine lint and import check
        run: npm run lint -w @gavel/engine
      - name: Voice lint
        # The root ESLint reads packages/voice/eslint.config.js (flat config).
        run: npm run lint -w @gavel/voice
      - name: Engine trace baseline
        run: npm run check:trace -w @gavel/engine
      - name: Server trace baseline
        run: npm run check:trace -w @gavel/server
  prod-build:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: npm run build -w @gavel/server
      - run: node scripts/smoke-dist.mjs
  required:
    if: ${{ always() }}
    needs:
      - changes
      - prod-build
      - package-checks
      - typecheck
      - lint
      - format-check
      - unit
      - coverage
      - property
      - scenarios
      - deps
      - secrets
      - ascii-banned
      - docs-format
      - commitlint
      - voice
      - e2e-fixtures
      - reference-python
      - differential
      - tools
      - openapi
      - ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Every job must succeed. Two kinds of skip are accepted: `ownership` is defined for pull
      # requests alone, and the build, test, type and package-check jobs are skipped when the
      # `changes` job found a documentation-only pull request (classifier output code=false). A
      # job skipped for any other reason, or whose `changes` job failed, is not accepted.
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            const docsOnly = needs.changes.result === "success" && needs.changes.outputs.code === "false";
            const docsSkippable = new Set(["typecheck", "lint", "unit", "coverage", "property", "scenarios", "deps", "voice", "reference-python", "prod-build", "package-checks"]);
            let bad = 0;
            for (const [name, job] of Object.entries(needs)) {
              const okSkip =
                (name === "ownership" && process.env.EVENT !== "pull_request") ||
                (docsOnly && docsSkippable.has(name));
              const ok = job.result === "success" || (okSkip && job.result === "skipped");
              console.log(name + ": " + job.result + (ok ? "" : "  <-- not accepted"));
              if (!ok) bad += 1;
            }
            process.exit(bad === 0 ? 0 : 1);
          '
