name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job here is real: an npm script that is not implemented exits 1 instead of passing.
# The browser end-to-end job is absent until packages/e2e has a Playwright suite; it joins the
# `required` list in the change that adds it.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: npm run typecheck
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: npm run lint
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: npm run format:check
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: npm test
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: npm run test:coverage
      - name: Thresholds may only be raised
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/check-coverage.mjs --ratchet "origin/${{ github.base_ref }}"
  property:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: npm run test:property
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: npm run test:scenarios
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: npm run check:deps
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - run: node scripts/check-bundle-secrets.mjs --self-test
      - name: Build the web bundle with canary secrets and scan it
        run: npm run check:secrets
        env:
          VITE_SANDBOX: 'true'
          PAYPAL_CLIENT_SECRET: canary-paypal-client-secret-4f9c2a71
          PAYPAL_WEBHOOK_ID: canary-paypal-webhook-id-4f9c2a71
          DEEPGRAM_API_KEY: canary-deepgram-api-key-4f9c2a71
          GROQ_API_KEY: canary-groq-api-key-4f9c2a71
          LLM_API_KEY: canary-llm-api-key-4f9c2a71
          ADMIN_TOKEN: canary-admin-token-4f9c2a71
          AUCTIONEER_TOKEN_SECRET: canary-auctioneer-token-4f9c2a71
          DATABASE_URL: canary-database-url-4f9c2a71
  ascii-banned:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: npm run check:ascii
      # The word list is a secret, so the scanner that sees it must not be code from the pull
      # request. It runs from the base commit and reads the pull request tree as data.
      - name: Check out the trusted scanner (base commit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Banned words
        run: node trusted/scripts/check-banned-words.mjs --root .
        env:
          BANNED_WORDS: ${{ secrets.BANNED_WORDS }}
          # Pull requests from forks never receive the secret; the same check runs on main.
          BANNED_WORDS_ALLOW_EMPTY: ${{ github.event.pull_request.head.repo.fork == true }}
  docs-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - run: node scripts/check-docs-format.mjs --self-test
      - run: node scripts/check-docs-format.mjs
      - run: node scripts/check-gates-result.mjs
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint commit messages
        if: ${{ github.event_name == 'pull_request' && hashFiles('commitlint.config.*') != '' }}
        run: npx commitlint --from "origin/${{ github.base_ref }}" --to HEAD
  ownership:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - run: npm run check:ownership
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: origin/${{ github.base_ref }}
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'
      - name: Python parser golden is up to date
        run: python3 packages/voice/scripts/export-golden.py --check
      - name: Bundle size limit
        run: npm run size -w @gavel/voice
  e2e-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Synthesize audio fixtures
        run: node packages/e2e/fixtures/audio/generate.mjs
      - name: Validate fixtures
        run: node scripts/check-fixtures.mjs
  reference-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'
      - run: pip install pytest hypothesis
      - run: pytest -q
        working-directory: reference/python
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: npm run test:tools
  required:
    if: ${{ always() }}
    needs:
      - typecheck
      - lint
      - format-check
      - unit
      - coverage
      - property
      - scenarios
      - deps
      - secrets
      - ascii-banned
      - docs-format
      - commitlint
      - voice
      - e2e-fixtures
      - reference-python
      - tools
      - ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Every job must succeed. Only `ownership` may be skipped, and only because it is defined
      # for pull requests alone (it has an event-based `if`).
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            let bad = 0;
            for (const [name, job] of Object.entries(needs)) {
              const okSkip = name === "ownership" && process.env.EVENT !== "pull_request";
              const ok = job.result === "success" || (okSkip && job.result === "skipped");
              console.log(name + ": " + job.result + (ok ? "" : "  <-- not accepted"));
              if (!ok) bad += 1;
            }
            process.exit(bad === 0 ? 0 : 1);
          '
