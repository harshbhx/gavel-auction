name: deploy-web
# Builds the real web app (packages/web, not the mock server) against the hosted API and uploads
# it as the artifact `web-dist`. When the repository secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID are both set it also deploys the build as the Worker `gavel-web`
# (infra/web/wrangler.toml); otherwise it ends green with a notice and the artifact is deployed by hand.
# Only public values go into the build: the API origins and the PayPal sandbox client id.
# Steps are in docs/DEPLOY.md.
on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: 'API origin for this run only, for example https://api.example.org (empty uses the API_ORIGIN variable)'
        required: false
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - 'infra/web/**'
      - '.github/workflows/deploy-web.yml'
  pull_request:
    paths:
      - 'infra/web/**'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  VITE_SANDBOX: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.repository == 'harshbhx/gavel-auction' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      # The API origin comes from the input api_origin (one run) or the repository variable API_ORIGIN.
      # Empty means the current Render host. The websocket base is derived from it.
      - name: Resolve the API origin
        env:
          INPUT_ORIGIN: ${{ inputs.api_origin }}
          VAR_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          origin="${INPUT_ORIGIN:-$VAR_ORIGIN}"
          origin="${origin:-https://api.gavel.dualmindlab.tech}"
          if ! printf '%s' "$origin" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$'; then
            echo "::error::The API origin must be an https origin with no path and no trailing slash, for example https://api.example.org. Fix the api_origin input or the API_ORIGIN variable."
            exit 1
          fi
          {
            echo "VITE_API_BASE=$origin"
            echo "VITE_WS_BASE=wss://${origin#https://}"
          } >> "$GITHUB_ENV"
          echo "Web build API origin: $origin" >> "$GITHUB_STEP_SUMMARY"
      # Social crawlers (Open Graph, Twitter, Slack) do not read SVG, so the share image, the .ico
      # favicon and the touch and app icons are rendered here from the committed SVG sources
      # (mirrors of brand/svg) and never committed.
      - name: Render the share image and icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick
          p=packages/web/public
          rsvg-convert -w 1200 -h 630 $p/og.svg -o $p/og.png
          rsvg-convert -w 1200 -h 600 $p/og-twitter.svg -o $p/twitter.png
          for n in 16 32 48; do rsvg-convert -w $n -h $n $p/favicon.svg -o "$RUNNER_TEMP/favicon-$n.png"; done
          convert "$RUNNER_TEMP/favicon-16.png" "$RUNNER_TEMP/favicon-32.png" "$RUNNER_TEMP/favicon-48.png" $p/favicon.ico
          rsvg-convert -w 180 -h 180 $p/app-icon.svg -o $p/apple-touch-icon.png
          rsvg-convert -w 192 -h 192 $p/app-icon.svg -o $p/android-chrome-192x192.png
          rsvg-convert -w 512 -h 512 $p/app-icon.svg -o $p/android-chrome-512x512.png
          rsvg-convert -w 512 -h 512 $p/app-icon-maskable.svg -o $p/maskable-512x512.png

      - name: Build the web app
        env:
          VITE_PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
        run: npm run build -w @gavel/web
      - name: Check the build
        run: |
          test -f packages/web/dist/index.html
          test -f packages/web/dist/_headers
          test -f packages/web/dist/robots.txt
          test -f packages/web/dist/site.webmanifest
          test -f packages/web/dist/favicon.svg
          test -f packages/web/dist/favicon.ico
          test -f packages/web/dist/og.png
          test -f packages/web/dist/apple-touch-icon.png
          test -f packages/web/dist/maskable-512x512.png
          test "$(file -b --mime-type packages/web/dist/og.png)" = "image/png"
          test "$(identify -format '%wx%h' packages/web/dist/og.png)" = "1200x630"
          if grep -rq "localhost:8787" packages/web/dist; then
            echo "::error::The build still points at localhost"; exit 1
          fi
          grep -rlqF "$VITE_API_BASE" packages/web/dist
          grep -rlqF "$VITE_WS_BASE" packages/web/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-dist
          path: packages/web/dist
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check configuration
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo "The repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set."
              echo "The build is the artifact \`web-dist\` of this run: download it into infra/web/dist"
              echo "and run \`npx wrangler deploy\` in infra/web."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Cloudflare secrets are not set; deploy skipped. The artifact web-dist holds the build."
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-dist
          path: infra/web/dist
      - if: steps.gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/web
          command: deploy
