name: quarantine
# Flake tracking and quarantine (R-QA-033). Reads a flake log, records retried tests and, for a
# test that flaked twice inside 7 days, opens one issue asking for the @quarantine tag.
# The flake log is stored as an artifact of this workflow between runs. A test whose title
# carries @quarantine is excluded from required checks (see packages/e2e/src/report/flakes.ts).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quarantine
  cancel-in-progress: false

jobs:
  flakes:
    # Only runs of this repository count; a fork pull request whose branch is called main also
    # matches the branches filter, so the event and the head repository are checked as well.
    if: ${{ github.repository == 'harshbhx/gavel-auction' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Fetch the previous flake log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p report/in
          # Take the newest flake log written by a run of this workflow on main in this repository.
          want="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=flake-log&per_page=30" \
            --jq '.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main") | "\(.id) \(.workflow_run.id)"')"
          while read -r id rid; do
            [ -n "$id" ] || continue
            info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid" --jq '[.path, .head_branch, .head_repository.full_name] | @tsv')"
            if [ "$info" != "$(printf '.github/workflows/quarantine.yml\tmain\t%s' "$GITHUB_REPOSITORY")" ]; then
              echo "Skipping artifact $id from run $rid ($info)"
              continue
            fi
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > flake-log.zip
            unzip -o -q flake-log.zip -d report
            break
          done <<< "$want"
      - name: Fetch retried tests of the triggering run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The e2e job uploads report/outcomes.json (test, retries, passed) when it ran. It is read
          # only from a push run of the ci workflow on main in this repository at the triggering commit.
          if [ -n "$RUN_ID" ]; then
            info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '[.path, .event, .head_branch, .head_repository.full_name, .head_sha] | @tsv')"
            if [ "$info" = "$(printf '.github/workflows/ci.yml\tpush\tmain\t%s\t%s' "$GITHUB_REPOSITORY" "$HEAD_SHA")" ]; then
              gh run download "$RUN_ID" -n e2e-outcomes -D report/in 2>/dev/null || echo "no outcomes artifact for run $RUN_ID"
            else
              echo "Ignoring run $RUN_ID ($info)"
            fi
          fi
          [ -f report/in/outcomes.json ] || echo '[]' > report/in/outcomes.json
      - name: Record flakes
        run: npx vite-node packages/e2e/src/report/flakes-cli.ts -- report/flakes.json report/in/outcomes.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flake-log
          path: report/flakes.json
          retention-days: 30
      - name: Open an issue per newly quarantined test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f report/newly-quarantined.txt ] || exit 0
          while IFS= read -r name; do
            # Names come from an artifact: keep printable ASCII only and cap the length.
            name="$(printf '%s' "$name" | LC_ALL=C tr -cd '[:print:]' | cut -c1-120)"
            [ -n "$name" ] || continue
            gh issue create --title "Quarantine flaky test: $name" \
              --body "This test passed only after a retry twice in 7 days. Add the @quarantine tag to its title, find the cause and remove the tag when it is fixed. Source: flake log of the quarantine workflow."
          done < report/newly-quarantined.txt
