name: sdk-release
# Builds the generated GAVEL SDKs (sdks/typescript, sdks/python, sdks/csharp) and publishes them as a GitHub
# Release. GitHub only: nothing here talks to npm or PyPI. Runs on pull requests that touch
# sdks/ (build check, artifacts only) and on a pushed tag sdk-v<version> (build, then release).
on:
  pull_request:
    paths:
      - 'sdks/**'
      - '.github/workflows/sdk-release.yml'
  push:
    tags: ['sdk-v*']

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Smoke import
        run: npm run smoke
      - name: Pack
        run: |
          mkdir -p ../../dist-sdk
          npm pack --pack-destination ../../dist-sdk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-typescript
          path: dist-sdk/*.tgz
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir ../../dist-sdk
      - name: Smoke import
        run: |
          python -m pip install ../../dist-sdk/*.whl
          python -c "import gavel_host_api; print('import ok')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-python
          path: dist-sdk/*
          if-no-files-found: error

  csharp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Build and pack
        run: dotnet pack sdks/csharp/src/GavelHostApi/GavelHostApi.csproj -c Release -o dist-sdk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-csharp
          path: dist-sdk/*.nupkg
          if-no-files-found: error

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/sdk-v') }}
    needs: [typescript, python, csharp]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist-sdk
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist-sdk
          gh release create "$TAG" dist-sdk/* \
            --title "gavel-sdk ${TAG#sdk-v} (beta)" \
            --notes-file sdks/RELEASE-NOTES.md \
            --verify-tag
