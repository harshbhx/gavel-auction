name: voice
on:
  pull_request:
    paths: ['packages/voice/**', '.github/workflows/voice.yml']
  push:
    branches: [main]
    paths: ['packages/voice/**', '.github/workflows/voice.yml']
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck -w @gavel/voice
      - run: npm run lint -w @gavel/voice
      - run: npm test -w @gavel/voice
      - name: size-limit
        if: ${{ hashFiles('packages/voice/src/parser/parse.ts') != '' && hashFiles('packages/voice/src/decide/policy.ts') != '' && hashFiles('packages/voice/src/browser/capture.ts') != '' }}
        run: npm run size -w @gavel/voice
