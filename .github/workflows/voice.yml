name: voice
on:
  pull_request:
    paths: ['packages/voice/**', 'reference/python/parser*.py', '.github/workflows/voice.yml']
  push:
    branches: [main]
    paths: ['packages/voice/**', 'reference/python/parser*.py', '.github/workflows/voice.yml']
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python parser golden is up to date
        run: python3 packages/voice/scripts/export-golden.py --check
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck -w @gavel/voice
      - run: ./node_modules/.bin/eslint packages/voice/src --max-warnings 0
      - run: npm test -w @gavel/voice
      - name: size-limit
        if: ${{ hashFiles('packages/voice/src/parser/parse.ts') != '' && hashFiles('packages/voice/src/decide/policy.ts') != '' && hashFiles('packages/voice/src/browser/capture.ts') != '' }}
        run: npm run size -w @gavel/voice
