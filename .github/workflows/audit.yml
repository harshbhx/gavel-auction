name: audit
# Runs the dependency audit gate with expiring waivers (scripts/check-audit.mjs, T-QA-077).
# This job is not in the `required` roll-up of ci.yml yet: it starts as an informational check,
# and joins the roll-up once a clean run on main shows it is stable. It also runs every week so
# an advisory that lands on an untouched main is seen.
on:
  pull_request:
    paths:
      - package-lock.json
      - '**/package.json'
      - audit-waivers.json
      - scripts/check-audit.mjs
      - .github/workflows/audit.yml
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          build-cache: 'false'
      - run: npm run check:audit
