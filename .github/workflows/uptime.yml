name: uptime
# Probes /healthz, /readyz and /warmup of the production host (R-QA-045, R-QA-048).
# Schedule: requested every 15 minutes, but GitHub schedules cron on a best-effort basis. Observed
# on this repository (6 to 9 Nov 2026): one run every 4 to 8 hours, many skipped. Do not read this
# workflow as a 5-minute or even a 15-minute probe. A failed round is re-probed after 30 seconds
# inside the same job, and when the failure stands the job opens one Needs-you issue (or comments
# on the open one) right away: it does not wait for a second run, because the next run may be
# hours away. A reliable minute-level probe needs the external monitor described in infra/uptime.md
# (none is configured yet).
# On by default. Set the repository variable UPTIME_ENABLED to 'false' to switch it off.
# Targets: the API (PRODUCTION_URL, default https://api.gavel.dualmindlab.tech), the web app
# (WEB_URL variable, default https://gavel.dualmindlab.tech) and the docs host (DOCS_URL variable,
# default https://docs.gavel.dualmindlab.tech). The job log lists every URL with status and latency.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  probe:
    if: ${{ github.repository == 'harshbhx/gavel-auction' && vars.UPTIME_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://api.gavel.dualmindlab.tech' }}
      WEB_URL: ${{ vars.WEB_URL || 'https://gavel.dualmindlab.tech' }}
      DOCS_URL: ${{ vars.DOCS_URL || 'https://docs.gavel.dualmindlab.tech' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Probe the routes
        id: probe
        run: |
          failed=""
          probe() {
            local url="$1" out code ms
            out="$(curl -sS -o /dev/null -w '%{http_code} %{time_total}' --max-time 20 "$url" || true)"
            code="${out%% *}"
            ms="$(awk -v t="${out#* }" 'BEGIN { printf "%d", t * 1000 }' 2>/dev/null || echo 0)"
            case "$code" in
              2??) echo "ok   $code ${ms}ms $url" ;;
              *) echo "FAIL ${code:-000} ${ms}ms $url"; failed="$failed $url" ;;
            esac
          }
          round() {
            failed=""
            for path in /healthz /readyz /warmup; do probe "${PRODUCTION_URL%/}$path"; done
            probe "${WEB_URL%/}/"
            probe "${DOCS_URL%/}/"
          }
          round
          if [ -n "$failed" ]; then
            echo "Round failed, probing again in 30 seconds to rule out a blip"
            sleep 30
            round
          fi
          if [ -n "$failed" ]; then
            echo "::error title=Uptime probe failed::failing:$failed"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Raise an alert when the failure stands after the re-probe
        if: steps.probe.outputs.failed == 'true'
        run: |
          title="Needs you: production host is failing its uptime probe"
          open="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$open" ]; then
            gh issue create --title "$title" --body "A probe round and its re-probe 30 seconds later both failed against the production host. See the uptime workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This workflow runs on GitHub's best-effort schedule, so the outage may have begun hours earlier."
          else
            gh issue comment "$open" --body "Still failing: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          exit 1
