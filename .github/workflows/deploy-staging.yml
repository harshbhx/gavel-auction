name: deploy-staging
# NOT THE REAL DEPLOY PATH. The live API is deployed by the owner with Manual Deploy of main in the
# Render dashboard (docs/DEPLOY.md, "The one real deploy path"). This workflow is an optional extra: it
# calls a Render deploy hook and runs scripts/smoke.sh, but only when environment `staging` has the secret
# RENDER_DEPLOY_HOOK_URL and the variable STAGING_URL, and only when started by hand. It no longer runs
# on pushes, so no green check can suggest that a push was deployed or smoke tested (#2068).
# Not configured: the run prints SKIPPED in the job summary and a manual dispatch fails.
# Values reach steps only through env and are never echoed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'harshbhx/gavel-auction' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check configuration
        id: cfg
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          missing=""
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then missing="$missing secret:RENDER_DEPLOY_HOOK_URL"; fi
          if [ -z "$STAGING_URL" ]; then missing="$missing variable:STAGING_URL"; fi
          if [ -n "$missing" ]; then
            echo "::warning title=Deploy SKIPPED, nothing was deployed or smoke tested::Not configured, add to environment staging:$missing (see docs/DEPLOY.md)"
            {
              echo "## deploy-staging: SKIPPED"
              echo "Nothing was deployed and no smoke test ran. Missing:$missing (see docs/DEPLOY.md)."
              echo "The API is deployed with Manual Deploy of main in the Render dashboard (docs/DEPLOY.md)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Deploy requested but not configured::You started this deploy by hand, so this run fails"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger the Render deploy
        if: steps.cfg.outputs.ready == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$RENDER_DEPLOY_HOOK_URL" || true)"
          case "$code" in
            2??) echo "Render accepted the deploy ($code)" ;;
            *) echo "::error title=Deploy hook::Render answered $code"; exit 1 ;;
          esac
      - name: Smoke
        if: steps.cfg.outputs.ready == 'true'
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          SMOKE_RETRIES: '60'
        run: |
          # The old instance can answer before the new build is live, so wait until /version serves this commit.
          bash scripts/wait-version.sh "$STAGING_URL" "$GITHUB_SHA" 900
          scripts/smoke.sh "$STAGING_URL"
      - uses: ./.github/actions/setup
        if: steps.cfg.outputs.ready == 'true'
      - name: Security checks against staging
        if: steps.cfg.outputs.ready == 'true'
        env:
          GAVEL_STAGING_URL: ${{ vars.STAGING_URL }}
          GAVEL_REQUIRE_STAGING: '1'
        run: npx vitest run --project unit:e2e test/security/headers test/security/fuzz test/security/staging
