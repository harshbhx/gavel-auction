name: brand-assets
# Renders the GAVEL brand (brand/svg) into the raster set and the animated sting video, in CI only.
# Artifacts: brand-raster (favicons, touch and app icons, share images) and brand-sting (MP4, WebM,
# WebM with alpha, ProRes 4444 with alpha). The repo never commits rasters (deploy-web renders the web
# favicon and share image from the SVG sources), so the outputs stay artifacts.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'brand/**'
      - '.github/workflows/brand-assets.yml'
  push:
    branches: [main]
    paths:
      - 'brand/**'
      - '.github/workflows/brand-assets.yml'

permissions:
  contents: read

concurrency:
  group: brand-assets-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  raster:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check the SVG sources
        run: |
          # Outlined paths only: no <text>, no font references, no external references.
          if grep -lE '<text|font-family|<image|href=' brand/svg/*.svg; then
            echo "::error::Brand SVGs must be outlined paths with no text, fonts or external references"; exit 1
          fi
          for f in brand/svg/*.svg; do python3 -c "import sys,xml.dom.minidom as m; m.parse(sys.argv[1])" "$f"; done
      - name: Install renderers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick
      - name: Render the raster set
        run: |
          out=out/raster; mkdir -p "$out"; s=brand/svg
          for n in 16 32 48; do rsvg-convert -w $n -h $n $s/favicon.svg -o "$out/favicon-$n.png"; done
          convert "$out/favicon-16.png" "$out/favicon-32.png" "$out/favicon-48.png" "$out/favicon.ico"
          cp "$out/favicon-16.png" "$out/favicon-16x16.png"; cp "$out/favicon-32.png" "$out/favicon-32x32.png"
          rm "$out/favicon-16.png" "$out/favicon-32.png" "$out/favicon-48.png"
          rsvg-convert -w 180 -h 180 $s/app-icon.svg -o "$out/apple-touch-icon.png"
          rsvg-convert -w 192 -h 192 $s/app-icon.svg -o "$out/android-chrome-192x192.png"
          rsvg-convert -w 512 -h 512 $s/app-icon.svg -o "$out/android-chrome-512x512.png"
          rsvg-convert -w 512 -h 512 $s/app-icon-maskable.svg -o "$out/maskable-512x512.png"
          rsvg-convert -w 1200 -h 630 $s/og.svg -o "$out/og.png"
          rsvg-convert -w 1200 -h 600 $s/og-twitter.svg -o "$out/twitter.png"
          rsvg-convert -w 1024 $s/mark-color.svg -o "$out/mark-color-1024.png"
          rsvg-convert -w 2048 $s/lockup-h-color.svg -o "$out/lockup-h-color-2048.png"
          rsvg-convert -w 2048 $s/lockup-h-reversed.svg -o "$out/lockup-h-reversed-2048.png"
      - name: Check the raster set
        run: |
          cd out/raster
          test "$(identify -format '%wx%h' og.png)" = "1200x630"
          test "$(identify -format '%wx%h' twitter.png)" = "1200x600"
          test "$(identify -format '%wx%h' apple-touch-icon.png)" = "180x180"
          test "$(identify -format '%wx%h' maskable-512x512.png)" = "512x512"
          test "$(identify favicon.ico | wc -l)" = "3"
          ls -l >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brand-raster
          path: out/raster
          if-no-files-found: error
          retention-days: 7

  sting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 22
      - name: Install Playwright and ffmpeg
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg
      - name: Capture frames (30 fps, 1920x1080, 3 s)
        run: PW_DIR="$RUNNER_TEMP/pw" node brand/scripts/render-sting.mjs "$RUNNER_TEMP/frames"
      - name: Encode
        run: |
          out=out/sting; mkdir -p "$out"; f="$RUNNER_TEMP/frames"
          ffmpeg -loglevel error -framerate 30 -i "$f/paper/f%03d.png" -c:v libx264 -pix_fmt yuv420p -crf 14 -movflags +faststart "$out/gavel-sting-1080p.mp4"
          ffmpeg -loglevel error -framerate 30 -i "$f/paper/f%03d.png" -c:v libvpx-vp9 -pix_fmt yuv420p -crf 24 -b:v 0 "$out/gavel-sting-1080p.webm"
          ffmpeg -loglevel error -framerate 30 -i "$f/alpha/f%03d.png" -c:v libvpx-vp9 -pix_fmt yuva420p -auto-alt-ref 0 -crf 24 -b:v 0 "$out/gavel-sting-alpha.webm"
          ffmpeg -loglevel error -framerate 30 -i "$f/alpha/f%03d.png" -c:v prores_ks -profile:v 4444 -pix_fmt yuva444p10le "$out/gavel-sting-alpha.mov"
          cp "$f/paper/f089.png" "$out/gavel-sting-last-frame.png"
      - name: Check the video
        run: |
          cd out/sting
          for v in gavel-sting-1080p.mp4 gavel-sting-1080p.webm gavel-sting-alpha.mov; do
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 $v)" = "1920,1080"
          done
          d="$(ffprobe -v error -show_entries format=duration -of csv=p=0 gavel-sting-1080p.mp4)"
          awk -v d="$d" 'BEGIN{exit !(d>2.9 && d<3.1)}'
          ls -l >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brand-sting
          path: out/sting
          if-no-files-found: error
          retention-days: 7
