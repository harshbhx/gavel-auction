name: flaky-loop-replay-audio
# One-off stability proof for replayAudioSettlement.test.tsx. Removed before merge.
on:
  pull_request:
    paths:
      - 'packages/web/test/component/replayAudioSettlement.test.tsx'
      - '.github/workflows/flaky-loop-replay-audio.yml'

permissions:
  contents: read

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run the file 50 times
        run: |
          pass=0
          fail=0
          for i in $(seq 1 50); do
            if npx vitest run --project 'unit:web' packages/web/test/component/replayAudioSettlement.test.tsx >/tmp/run.log 2>&1; then
              pass=$((pass + 1))
            else
              fail=$((fail + 1))
              tail -40 /tmp/run.log
            fi
          done
          echo "passed=$pass failed=$fail"
          test "$fail" -eq 0
