name: clean-clone
# Checks a fresh checkout of the default branch: install, light verification, then the public-repo
# file checks (scripts/clean-clone-check.mjs). No secrets are used. Runs weekly and on demand.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          build-cache: 'false'
      - run: npm run typecheck
      - run: npx vitest run --project unit:shared --project unit:engine
      - run: npm run test:scenarios
      - run: node scripts/clean-clone-check.mjs
