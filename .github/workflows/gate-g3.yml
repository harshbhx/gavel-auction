name: gate-g3
# Sandbox gate G3: does an authorization stay capturable past the honor period, and does
# reauthorize extend it? Run manually from main to start the probe (day 0: a headless browser
# signs in as the sandbox buyer and approves four orders). The scheduled runs pick the probe up
# again and do the checks at 3.5, 4 and 5 days; the last one appends the GATES.md entry.
# Actions secrets needed: PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, SANDBOX_BUYER_EMAIL,
# SANDBOX_BUYER_PASSWORD. Both triggers run only from main, so code on a pushed branch never
# reads the secrets.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  actions: read

jobs:
  g3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.ref == 'refs/heads/main' }}
    concurrency:
      group: gate-g3
      cancel-in-progress: false
    env:
      GATE_CURRENCY: INR
      STATE: ${{ github.workspace }}/g3-state
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore the probe state
        env:
          GH_TOKEN: ${{ github.token }}
          G3_TAG_KEY: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        run: |
          g3_tag() {
            (cd "$1" && find . -type f \( -name '*.run.json' -o -name 'complete.marker' \) | LC_ALL=C sort | xargs -r sha256sum | sha256sum \
              | cut -d' ' -f1 | openssl dgst -sha256 -hmac "$G3_TAG_KEY" -r | cut -d' ' -f1)
          }
          mkdir -p "$STATE"
          # Only an artifact uploaded by a completed run of this workflow on main counts, and
          # only when its manifest tag matches (the tag is keyed with a repository secret,
          # which a pull request run cannot read).
          mkdir -p "$STATE"
          want=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=g3-probe-state&per_page=30" \
            --jq '.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main") | "\(.id) \(.workflow_run.id)"')
          while read -r aid rid; do
            [ -n "$aid" ] || continue
            run_info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid" --jq '[.path, .event, .head_branch, .conclusion] | @tsv')
            case "$run_info" in
              ".github/workflows/gate-g3.yml"$'\t'schedule$'\t'main$'\t'* | ".github/workflows/gate-g3.yml"$'\t'workflow_dispatch$'\t'main$'\t'*) ;;
              *) echo "Skipping artifact $aid from run $rid ($run_info)"; continue ;;
            esac
            rm -rf "$STATE" && mkdir -p "$STATE"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" > "$RUNNER_TEMP/g3-state.zip"
            unzip -o "$RUNNER_TEMP/g3-state.zip" -d "$STATE"
            if [ "$(g3_tag "$STATE")" = "$(cat "$STATE/state.tag" 2>/dev/null)" ]; then
              echo "Using probe state from run $rid"
              break
            fi
            echo "Tag mismatch in artifact $aid; ignoring it"
            rm -rf "$STATE" && mkdir -p "$STATE"
          done <<< "$want"
          resume=$(find "$STATE" -name '*.run.json' | sort | tail -1)
          done_marker=$(find "$STATE" -name 'complete.marker' | head -1)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ -z "$resume" ]; then echo "mode=skip" >> "$GITHUB_ENV"; echo "No probe is running; start one with Run workflow."; exit 0; fi
            if [ -n "$done_marker" ]; then echo "mode=skip" >> "$GITHUB_ENV"; echo "The probe is finished."; exit 0; fi
            echo "mode=resume" >> "$GITHUB_ENV"
            echo "RESUME_FILE=$resume" >> "$GITHUB_ENV"
          else
            rm -rf "$STATE" && mkdir -p "$STATE"
            echo "mode=start" >> "$GITHUB_ENV"
          fi
      - name: Check that the secrets exist
        if: ${{ env.mode == 'start' }}
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          SANDBOX_BUYER_EMAIL: ${{ secrets.SANDBOX_BUYER_EMAIL }}
          SANDBOX_BUYER_PASSWORD: ${{ secrets.SANDBOX_BUYER_PASSWORD }}
        run: |
          missing=""
          for name in PAYPAL_CLIENT_ID PAYPAL_CLIENT_SECRET SANDBOX_BUYER_EMAIL SANDBOX_BUYER_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these repository Actions secrets and run again:$missing"
            exit 2
          fi
      - uses: ./.github/actions/setup
        if: ${{ env.mode != 'skip' }}
      - name: Install the browser
        if: ${{ env.mode == 'start' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.49.1
          cd "$RUNNER_TEMP/pw" && npx playwright install --with-deps chromium
      - name: Day 0 of the probe
        if: ${{ env.mode == 'start' }}
        env:
          PAYPAL_ENV: sandbox
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          SANDBOX_BUYER_EMAIL: ${{ secrets.SANDBOX_BUYER_EMAIL }}
          SANDBOX_BUYER_PASSWORD: ${{ secrets.SANDBOX_BUYER_PASSWORD }}
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
        run: npm run gate:g3 -w @gavel/payments -- --browser --out "$STATE"
      - name: Checkpoints that are due
        if: ${{ env.mode == 'resume' }}
        env:
          PAYPAL_ENV: sandbox
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        run: npm run gate:g3 -w @gavel/payments -- --resume "$RESUME_FILE" --out "$STATE"
      # The state travels from one scheduled run to the next as an artifact, with a keyed tag.
      - name: Tag the probe state
        if: ${{ always() && env.mode != 'skip' }}
        env:
          G3_TAG_KEY: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        run: |
          (cd "$STATE" && rm -f state.tag && find . -type f \( -name '*.run.json' -o -name 'complete.marker' \) | LC_ALL=C sort | xargs -r sha256sum | sha256sum \
            | cut -d' ' -f1 | openssl dgst -sha256 -hmac "$G3_TAG_KEY" -r | cut -d' ' -f1 > state.tag)
      - name: Keep the probe state
        if: ${{ always() && env.mode != 'skip' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g3-probe-state
          path: ${{ env.STATE }}
          if-no-files-found: warn
          retention-days: 14
      # The GATES.md entry exists only after the last checkpoint; download it from that run.
      - name: Upload the entry
        if: ${{ always() && env.mode != 'skip' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g3-entry
          path: GATES.md
          if-no-files-found: ignore
          retention-days: 30
