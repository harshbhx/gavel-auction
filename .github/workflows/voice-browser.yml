name: voice-browser
# Informational capture CPU run (T-VOX-112, R-VOX-104): headless Chromium with a fake microphone feeds
# 60 s of synthetic audio to the capture worklet and the CPU table lands in the job summary. The job
# fails only when the worklet costs more than 15 percent of one core; the 5 percent target is reported.
# It is not part of the required roll-up in ci.yml and uses no secrets.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/voice/test/browser/**'
      - '.github/workflows/voice-browser.yml'

permissions:
  contents: read

concurrency:
  group: voice-browser-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Cache the browser
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.49.1-chromium
      - name: Install the browser
        env:
          BROWSER_CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.49.1
          cd "$RUNNER_TEMP/pw"
          if [ "$BROWSER_CACHE_HIT" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Measure capture CPU
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
        run: node --experimental-strip-types packages/voice/test/browser/cpu.spec.ts
