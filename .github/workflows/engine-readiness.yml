name: engine-readiness
on:
  pull_request:
    paths:
      - 'packages/engine/**'
      - 'docs/specs/engine/**'
      - 'packages/server/scripts/**'
      - 'packages/server/test/**'
      - 'docs/specs/realtime/**'
      - '.github/workflows/engine-readiness.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engine-readiness-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup
      - run: npm run check:trace -w @gavel/engine
  trace-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup
      - run: npm run check:trace -w @gavel/server
