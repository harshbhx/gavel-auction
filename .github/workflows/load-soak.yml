name: load-soak
# Full L3 hammer race (500 iterations), L4 webhook storm (50 duplicates) and the 30 minute L5 soak
# with 20 bidders (R-QA-030). Weekly and on manual dispatch; the pull request checks run scaled
# down versions in the e2e unit tests. The run is in process on the fake PayPal and needs no secret.
on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Soak length in minutes'
        default: '30'

permissions:
  contents: read

jobs:
  load:
    if: ${{ github.repository == 'harshbhx/gavel-auction' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run the load scenarios
        env:
          MINUTES: ${{ inputs.minutes || '30' }}
        run: npx vite-node packages/e2e/src/load/cli.ts -- all --minutes "$MINUTES" --out load-report/l3-l5.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: load-l3-l5
          path: load-report
          if-no-files-found: ignore
          retention-days: 30
