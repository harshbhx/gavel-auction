name: load-soak
# Full L3 hammer race (500 iterations), L4 webhook storm (50 duplicates) and the 30 minute L5 soak
# with 20 bidders (R-QA-030). Weekly and on manual dispatch; the pull request checks run scaled
# down versions in the e2e unit tests. The run is in process on the fake PayPal and needs no secret.
on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Soak length in minutes'
        default: '30'
      diag:
        description: 'Diagnostic run: only L5, with memory samples every 5 s (use minutes=2)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  load:
    if: ${{ github.repository == 'harshbhx/gavel-auction' && !inputs.diag }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # One process per scenario: a heap that grows in one scenario cannot take the others down, and
      # each writes its own report. The per-call fake PayPal log goes to a file, not the job log.
      - name: L3 hammer race
        id: l3
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          mkdir -p load-report
          npx vite-node packages/e2e/src/load/cli.ts -- L3 --out load-report/l3.json > load-report/l3.log 2>&1 || { tail -n 40 load-report/l3.log; exit 1; }
          grep -E '^(L3|  (ok|FAIL))' load-report/l3.log
      - name: L4 webhook storm
        id: l4
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          mkdir -p load-report
          npx vite-node packages/e2e/src/load/cli.ts -- L4 --out load-report/l4.json > load-report/l4.log 2>&1 || { tail -n 40 load-report/l4.log; exit 1; }
          grep -E '^(L4|  (ok|FAIL))' load-report/l4.log
      - name: L5 soak
        id: l5
        continue-on-error: true
        env:
          MINUTES: ${{ inputs.minutes || '30' }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          mkdir -p load-report
          npx vite-node packages/e2e/src/load/cli.ts -- L5 --minutes "$MINUTES" --out load-report/l5.json > load-report/l5.log 2>&1 || { tail -n 40 load-report/l5.log; exit 1; }
          grep -E '^(L5|  (ok|FAIL))' load-report/l5.log
      - name: Summary
        if: ${{ always() }}
        run: |
          mkdir -p load-report
          {
            echo "## load-soak"
            echo "| scenario | outcome |"
            echo "| --- | --- |"
            echo "| L3 | ${{ steps.l3.outcome }} |"
            echo "| L4 | ${{ steps.l4.outcome }} |"
            echo "| L5 | ${{ steps.l5.outcome }} |"
            for f in load-report/l3.json load-report/l4.json load-report/l5.json; do
              if [ -f "$f" ]; then grep -H peakRssMb "$f" || true; fi
            done
          } | tee load-report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when a scenario failed
        if: ${{ steps.l3.outcome != 'success' || steps.l4.outcome != 'success' || steps.l5.outcome != 'success' }}
        run: exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: load-l3-l5
          path: load-report
          if-no-files-found: ignore
          retention-days: 30

  # Memory diagnosis (#2203): L5 alone with --diag, node --expose-gc for a live heap figure after a
  # forced collection. Manual only: gh workflow run load-soak.yml -f minutes=2 -f diag=true
  diag:
    if: ${{ github.repository == 'harshbhx/gavel-auction' && inputs.diag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: L5 soak with diagnostics
        env:
          MINUTES: ${{ inputs.minutes || '2' }}
          NODE_OPTIONS: --max-old-space-size=6144 --expose-gc
        run: |
          mkdir -p load-diag
          npx vite-node packages/e2e/src/load/cli.ts -- L5 --minutes "$MINUTES" --out load-diag/l5.json --diag load-diag/diag.json > load-diag/l5.log 2>&1 || { tail -n 40 load-diag/l5.log; true; }
          grep -E '^(L5|  (ok|FAIL))' load-diag/l5.log || true
          node -e "const d=require('./load-diag/diag.json');console.log('rssGrowthMb',d.rssGrowthMb,'liveHeapGrowthMb',d.liveHeapGrowthMb);for(const c of d.counterGrowth.slice(0,15))console.log(c.name,c.first,'->',c.last);for(const r of (d.retained||[]).slice(0,12))console.log('retained',r.selfMb,'MB',r.fn,r.url.split('/').slice(-3).join('/')+':'+r.line)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: load-diag
          path: load-diag
          if-no-files-found: ignore
          retention-days: 30
