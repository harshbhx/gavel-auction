name: docsite

# The GAVEL documentation website (docsite/): Fumadocs on a Next.js static export.
# Build, type check and screenshots run here, never on a laptop or the shared VM.
# Deploy to Cloudflare Pages runs only when the two Cloudflare secrets exist in the repository;
# without them the deploy job ends green and says so. The site content reads docs/GATES.md and
# docs/evidence/SIM/SIM-MULTIDAY.md, and the Changelog page is generated from CHANGELOG.md, so
# changes to those files rebuild it too.

on:
  push:
    branches: [main]
    paths:
      - 'docsite/**'
      - 'docs/GATES.md'
      - 'CHANGELOG.md'
      - 'docs/evidence/SIM/**'
      - 'openapi/**'
      - '.github/workflows/docsite.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docsite/**'
      - 'docs/GATES.md'
      - 'CHANGELOG.md'
      - 'docs/evidence/SIM/**'
      - 'openapi/**'
      - '.github/workflows/docsite.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docsite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the "Last updated" date on each page comes from git log.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docsite/package-lock.json

      - name: Install
        working-directory: docsite
        run: npm ci --ignore-scripts

      # The Changelog page is generated from CHANGELOG.md; the committed copy must match.
      - name: Changelog page is in sync
        working-directory: docsite
        run: node scripts/gen-changelog.mjs --check

      # Glossary data, <Term> ids, the tour and the related links: plain node, seconds.
      - name: Check the glossary
        working-directory: docsite
        run: node scripts/check-glossary.mjs

      # Static export: compiles every MDX page and writes docsite/out/.
      - name: Build
        working-directory: docsite
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Absolute address for Open Graph and metadataBase (docsite/lib/shared.ts).
          NEXT_PUBLIC_SITE_URL: https://docs.gavel.dualmindlab.tech
        run: npm run build

      # After the build, so the generated content types exist.
      - name: Type check (tsc)
        working-directory: docsite
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run types:check

      # JS budget: gzip size of the scripts the home page and a docs page load; search must stay lazy.
      - name: JavaScript budget
        working-directory: docsite
        run: node scripts/check-size.mjs out

      - name: Check the export
        working-directory: docsite
        run: |
          test -f out/index.html
          test -f out/llms.txt
          test -f out/llms-full.txt
          test -f out/openapi.yaml
          test -f out/api-reference.html
          grep -q 'id="createAuction"' out/api-reference.html
          test -f out/_headers
          grep -q "frame-ancestors 'none'" out/_headers
          grep -q "connect-src 'self' https://api.gavel.dualmindlab.tech;" out/_headers
          if grep -Eq "connect-src[^;]*https: " out/_headers; then echo 'connect-src must not allow every https host'; exit 1; fi
          grep -q '^/_next/static/\*' out/_headers
          grep -q 'immutable' out/_headers
          cmp out/openapi.yaml ../openapi/gavel.yaml
          echo "pages: $(find out/docs -name '*.html' | wc -l)"
          echo "llms-full.txt bytes: $(wc -c < out/llms-full.txt)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docsite
          path: docsite/out
          retention-days: 7

  # Screenshots of the key pages in three themes, as a review aid. Browser work stays in CI.
  shots:
    name: Screenshots
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docsite/package-lock.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: docsite
          path: docsite/out

      - name: Install the server and Playwright
        working-directory: docsite
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Take screenshots
        working-directory: docsite
        run: |
          node scripts/write-serve-json.mjs out
          npx serve out -l 4173 > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:4173/ > /dev/null && break; sleep 1; done
          node scripts/shots.mjs http://localhost:4173 shots out

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docsite-shots
          path: docsite/shots
          retention-days: 3

  # axe-core over the home page, a docs page, the glossary and the API reference, at desktop and
  # phone width. Fails on serious and critical violations; the full report is an artifact.
  a11y:
    name: Accessibility (axe)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docsite/package-lock.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: docsite
          path: docsite/out

      - name: Install the server, Playwright and axe-core
        working-directory: docsite
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts playwright@1.49.1 axe-core@4.10.2
          npx playwright install --with-deps chromium

      - name: Run axe
        working-directory: docsite
        run: |
          node scripts/write-serve-json.mjs out
          npx serve out -l 4174 > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:4174/ > /dev/null && break; sleep 1; done
          node scripts/a11y.mjs http://localhost:4174 a11y

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docsite-a11y
          path: docsite/a11y
          retention-days: 7

  # main: production. Pull requests from this repository: a preview at <branch>.<project>.pages.dev.
  # Skips cleanly (green, with a notice) when CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing.
  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: >-
      (github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.DOCSITE_PAGES_PROJECT || 'gavel-docs' }}
      REQUIRE_DEPLOY: ${{ vars.DOCSITE_REQUIRE_DEPLOY }}
    steps:
      - id: gate
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo "The repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set."
              echo "The built site is the artifact \`docsite\` of this run: download it and publish it"
              echo "with \`wrangler pages deploy\` to the Pages project \`$PAGES_PROJECT\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Cloudflare secrets are not set; nothing was deployed. The artifact docsite holds the built site."
            # Repository variable DOCSITE_REQUIRE_DEPLOY=true makes a skipped deploy on main a red job.
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${REQUIRE_DEPLOY:-}" = "true" ]; then
              echo "::error::Deploy skipped on a push to main while DOCSITE_REQUIRE_DEPLOY=true"
              exit 1
            fi
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: docsite
          path: site

      # The branch name is attacker-chosen text. It reaches the shell only through the env var
      # RAW_BRANCH and leaves this step as a sanitised alias of [A-Za-z0-9-] (max 40 chars).
      - if: steps.gate.outputs.enabled == 'true'
        id: alias
        env:
          RAW_BRANCH: ${{ github.head_ref || 'main' }}
        run: |
          alias="$(printf '%s' "$RAW_BRANCH" | tr -c 'A-Za-z0-9' '-' | sed -E 's/-+/-/g; s/^-+//; s/-+$//' | cut -c1-40 | sed -E 's/-+$//')"
          [ -n "$alias" ] || alias="preview"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then alias="main"; fi
          echo "branch=$alias" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.enabled == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # First run: create the Pages project (fails harmlessly once it exists).
          # The only branch text inlined below is the sanitised alias from the step above, which
          # holds [A-Za-z0-9-] only; the raw head_ref never appears in a command.
          preCommands: npx wrangler pages project create ${{ env.PAGES_PROJECT }} --production-branch=main || true
          command: pages deploy site --project-name=${{ env.PAGES_PROJECT }} --branch=${{ steps.alias.outputs.branch }} --commit-dirty=true

      - if: steps.gate.outputs.enabled == 'true'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "Deployed to $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"

  # main only: the public spec must be the one in this commit. Fails when a deploy ran but the
  # live /openapi.yaml still differs; when the deploy was skipped it warns with the line count
  # of the drift, so a green run can no longer hide a stale contract (#2424).
  published-spec:
    name: Published spec matches main
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compare the live spec with openapi/gavel.yaml
        run: |
          deployed=false
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then deployed=true; fi
          for i in 1 2 3 4 5 6; do
            curl -fsS https://docs.gavel.dualmindlab.tech/openapi.yaml -o live.yaml || true
            if [ -s live.yaml ] && cmp -s live.yaml openapi/gavel.yaml; then
              echo "The published spec matches main." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [ "$deployed" = "true" ] || break
            sleep 20
          done
          lines=$(diff live.yaml openapi/gavel.yaml 2>/dev/null | grep -c '^[<>]' || true)
          echo "### Published spec is stale" >> "$GITHUB_STEP_SUMMARY"
          echo "https://docs.gavel.dualmindlab.tech/openapi.yaml differs from openapi/gavel.yaml ($lines differing lines)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$deployed" = "true" ]; then
            echo "::error::The deploy ran but the published openapi.yaml differs from main ($lines lines)"
            exit 1
          fi
          echo "::warning::No deploy ran and the published openapi.yaml differs from main ($lines lines). Publish the docsite artifact."
