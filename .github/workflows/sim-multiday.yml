name: sim-multiday
# Multi-day simulated-clock suite: our settlement code against the fake PayPal's model of
# authorization time (honor period, validity, reauthorize). No secrets, no network. It does not
# replace the real G3 probe. The suite writes docs/evidence/SIM/SIM-MULTIDAY.md; the job fails when the
# committed copy is not the one the suite produces.
on:
  pull_request:
    paths:
      - '.github/workflows/sim-multiday.yml'
      - 'packages/payments/src/**'
      - 'packages/payments/test/simdays/**'
      - 'docs/evidence/SIM/SIM-MULTIDAY.md'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sim-multiday:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run the suite and generate the report
        env:
          SIM_MULTIDAY_WRITE: '1'
        run: npm exec -w @gavel/payments -- vitest run test/simdays
      - name: Format the report like every other markdown file
        run: npx prettier --write docs/evidence/SIM/SIM-MULTIDAY.md
      - name: Keep the generated report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sim-multiday-report
          path: docs/evidence/SIM/SIM-MULTIDAY.md
          if-no-files-found: warn
      - name: The committed report is the generated one
        run: |
          if ! git diff --quiet -- docs/evidence/SIM/SIM-MULTIDAY.md || [ -n "$(git ls-files --others --exclude-standard -- docs/evidence/SIM/SIM-MULTIDAY.md)" ]; then
            echo "docs/evidence/SIM/SIM-MULTIDAY.md differs from the generated report. Download the sim-multiday-report artifact and commit it."
            exit 1
          fi
