name: gate-g0
# Runs the sandbox payment gate by hand. The PayPal sandbox secrets are repository-level Actions
# secrets: the `sandbox-nightly` environment has no reviewer, no branch rule and no secrets, so a
# workflow on any pushed branch can read them. Keep only throwaway sandbox values in them.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sandbox-nightly
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run G0
        env:
          PAYPAL_ENV: sandbox
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          GATE_CURRENCY: ${{ vars.GATE_CURRENCY }}
        run: npm run gate:g0 -w @gavel/payments -- --out "$PWD/docs/evidence"
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g0-evidence
          path: docs/evidence
          if-no-files-found: warn
          retention-days: 30
