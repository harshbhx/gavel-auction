name: voice-eval
# R-VOX-075: text and cached modes run on pull requests with no keys; live mode is manual and
# reads provider keys from repository secrets DEEPGRAM_API_KEY and GROQ_API_KEY.
on:
  pull_request:
    paths:
      - 'packages/voice/**'
      - '.github/workflows/voice-eval.yml'
  workflow_dispatch:
    inputs:
      provider:
        description: 'Live provider'
        required: true
        default: deepgram
        type: choice
        options:
          - deepgram
          - groq
      record:
        description: 'Render the synthetic clips and record both providers into stt-cache (uploads an artifact, no keys in it)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: voice-eval-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  text:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - name: Text mode (transcripts through the parser, no keys)
        run: npm run eval -w @gavel/voice -- --mode text --set all --out eval-out/text
      - name: Text mode, dev and held-out reported apart
        run: |
          npm run eval -w @gavel/voice -- --mode text --set dev --out eval-out/text/dev
          npm run eval -w @gavel/voice -- --mode text --set heldout --out eval-out/text/heldout
      - name: Job summary
        if: always()
        run: |
          if [ -f packages/voice/eval-out/text/report.md ]; then
            cat packages/voice/eval-out/text/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voice-eval-text
          path: packages/voice/eval-out/text
          if-no-files-found: ignore

  cached:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - name: Cached mode (recorded STT outputs through the parser, deterministic)
        # Fails when a provider directory or a clip is missing: a green run always scored every clip.
        run: |
          for p in deepgram groq; do
            npm run eval -w @gavel/voice -- --mode cached --provider "$p" --out "eval-out/cached/$p"
          done
      - name: Job summary
        if: always()
        run: |
          for p in deepgram groq; do
            if [ -f "packages/voice/eval-out/cached/$p/report.md" ]; then
              cat "packages/voice/eval-out/cached/$p/report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voice-eval-cached
          path: packages/voice/eval-out/cached
          if-no-files-found: ignore

  record:
    if: github.event_name == 'workflow_dispatch' && inputs.record
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - name: Install speech synthesizer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg jq
      - name: Render synthetic clips (noise-free, not a real-room test)
        run: bash packages/voice/scripts/render-clips.sh
      - name: Live eval against both providers, recording provider output
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          for p in deepgram groq; do
            npm run eval -w @gavel/voice -- --mode live --provider "$p" \
              --record fixtures/stt-cache --out "eval-out/live/$p"
          done
      - name: Job summary
        if: always()
        run: |
          for p in deepgram groq; do
            if [ -f "packages/voice/eval-out/live/$p/report.md" ]; then
              cat "packages/voice/eval-out/live/$p/report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voice-stt-record
          path: |
            packages/voice/fixtures/audio/recordings
            packages/voice/fixtures/stt-cache/deepgram
            packages/voice/fixtures/stt-cache/groq
            packages/voice/eval-out/live
          if-no-files-found: ignore

  live:
    if: github.event_name == 'workflow_dispatch' && !inputs.record
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - name: Live mode (audio through the provider)
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        # Exits 3 and fails this job when recordings are missing, so a green run always has scores.
        run: npm run eval -w @gavel/voice -- --mode live --provider "${{ inputs.provider }}" --out eval-out/live
      - name: Job summary
        if: always()
        run: |
          if [ -f packages/voice/eval-out/live/report.md ]; then
            cat packages/voice/eval-out/live/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voice-eval-live
          path: packages/voice/eval-out/live
          if-no-files-found: ignore
