name: voice-eval
# R-VOX-075: text and cached modes run on pull requests with no keys; live mode is manual and
# reads provider keys from repository secrets DEEPGRAM_API_KEY and GROQ_API_KEY.
on:
  pull_request:
    paths:
      - 'packages/voice/**'
      - '.github/workflows/voice-eval.yml'
  workflow_dispatch:
    inputs:
      provider:
        description: 'Live provider'
        required: true
        default: deepgram
        type: choice
        options:
          - deepgram
          - groq
      clips:
        description: 'Clip set for the record input: espeak (robotic, default) or human (human-like synthetic voice from fixtures/audio-human)'
        required: false
        default: espeak
        type: choice
        options:
          - espeak
          - human
      trials:
        description: 'Option trials: record both clip sets with each Deepgram and Groq option variant (uploads an artifact, no keys in it, nothing is committed)'
        required: false
        default: false
        type: boolean
      only:
        description: 'With trials: only run the variants whose name matches this extended regular expression (empty runs all)'
        required: false
        default: ''
        type: string
      record:
        description: 'Render the synthetic clips and record both providers into stt-cache (uploads an artifact, no keys in it)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: voice-eval-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  text:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - name: Text mode (transcripts through the parser, no keys)
        run: npm run eval -w @gavel/voice -- --mode text --set all --out eval-out/text
      - name: Text mode, dev and held-out reported apart
        run: |
          npm run eval -w @gavel/voice -- --mode text --set dev --out eval-out/text/dev
          npm run eval -w @gavel/voice -- --mode text --set heldout --out eval-out/text/heldout
      - name: Job summary
        if: always()
        run: |
          if [ -f packages/voice/eval-out/text/report.md ]; then
            cat packages/voice/eval-out/text/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voice-eval-text
          path: packages/voice/eval-out/text
          if-no-files-found: ignore

  cached:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - name: Cached mode (recorded STT outputs through the parser, deterministic)
        # Fails when a provider directory or a clip is missing: a green run always scored every clip.
        run: |
          for p in deepgram groq; do
            npm run eval -w @gavel/voice -- --mode cached --provider "$p" --out "eval-out/cached/$p"
          done
      - name: Cached mode, human-like synthetic voice set (second clip set, same 24 utterances)
        run: |
          for p in deepgram groq; do
            npm run eval -w @gavel/voice -- --mode cached --provider "$p" --clips human \
              --out "eval-out/cached-human/$p"
          done
      - name: Cached mode on a bidder's own device microphone (the one setting where bids can be auto-accepted)
        run: |
          for p in deepgram groq; do
            npm run eval -w @gavel/voice -- --mode cached --provider "$p" --mic device \
              --out "eval-out/cached-device/$p"
            npm run eval -w @gavel/voice -- --mode cached --provider "$p" --clips human --mic device \
              --out "eval-out/cached-device-human/$p"
          done
      - name: Cached mode on a device microphone with a second reading that always agrees (upper bound on AUTO)
        run: |
          for p in deepgram groq; do
            npm run eval -w @gavel/voice -- --mode cached --provider "$p" --mic device --model agree \
              --out "eval-out/cached-device-agree/$p"
            npm run eval -w @gavel/voice -- --mode cached --provider "$p" --clips human --mic device \
              --model agree --out "eval-out/cached-device-agree-human/$p"
          done
      - name: Job summary
        if: always()
        run: |
          for p in deepgram groq; do
            if [ -f "packages/voice/eval-out/cached/$p/report.md" ]; then
              cat "packages/voice/eval-out/cached/$p/report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ -f "packages/voice/eval-out/cached-human/$p/report.md" ]; then
              cat "packages/voice/eval-out/cached-human/$p/report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voice-eval-cached
          path: |
            packages/voice/eval-out/cached
            packages/voice/eval-out/cached-human
            packages/voice/eval-out/cached-device
            packages/voice/eval-out/cached-device-human
            packages/voice/eval-out/cached-device-agree
            packages/voice/eval-out/cached-device-agree-human
          if-no-files-found: ignore

  record:
    if: github.event_name == 'workflow_dispatch' && inputs.record && !inputs.trials && inputs.clips != 'human'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - name: Install speech synthesizer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg jq
      - name: Render synthetic clips (noise-free, not a real-room test)
        run: bash packages/voice/scripts/render-clips.sh
      - name: Live eval against both providers, recording provider output
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        # The Groq free tier answers 429 after a burst; --resume keeps what is recorded and the loop
        # waits a minute before asking for the rest.
        run: |
          rm -rf packages/voice/fixtures/stt-cache/deepgram packages/voice/fixtures/stt-cache/groq
          for p in deepgram groq; do
            for attempt in 1 2 3 4 5 6; do
              if npm run eval -w @gavel/voice -- --mode live --provider "$p" \
                --record fixtures/stt-cache --resume true --out "eval-out/live/$p"; then
                break
              fi
              [ "$attempt" = 6 ] && exit 1
              sleep 65
            done
          done
      - name: Job summary
        if: always()
        run: |
          for p in deepgram groq; do
            if [ -f "packages/voice/eval-out/live/$p/report.md" ]; then
              cat "packages/voice/eval-out/live/$p/report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voice-stt-record
          path: |
            packages/voice/fixtures/audio/recordings
            packages/voice/fixtures/stt-cache/deepgram
            packages/voice/fixtures/stt-cache/groq
            packages/voice/eval-out/live
          if-no-files-found: ignore

  record-human:
    if: github.event_name == 'workflow_dispatch' && inputs.record && !inputs.trials && inputs.clips == 'human'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Convert the human-like clips to 16 kHz mono wav (noise-free, not a real-room test)
        # Same framing as render-clips.sh: 300 ms of silence on both sides.
        run: |
          mkdir -p "$RUNNER_TEMP/human-wav"
          for f in packages/voice/fixtures/audio-human/*.mp3; do
            id="$(basename "$f" .mp3)"
            ffmpeg -nostdin -y -v error -i "$f" -af "adelay=300|300,apad=pad_dur=0.3" \
              -ar 16000 -ac 1 -c:a pcm_s16le "$RUNNER_TEMP/human-wav/$id.wav"
          done
          ls "$RUNNER_TEMP/human-wav" | wc -l
      - name: Live eval against both providers, recording provider output
        env:
          G5_AUDIO_DIR: ${{ runner.temp }}/human-wav
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          rm -rf packages/voice/fixtures/stt-cache-human/deepgram packages/voice/fixtures/stt-cache-human/groq
          for p in deepgram groq; do
            for attempt in 1 2 3 4 5 6; do
              if npm run eval -w @gavel/voice -- --mode live --provider "$p" \
                --record fixtures/stt-cache-human --resume true --out "eval-out/live-human/$p"; then
                break
              fi
              [ "$attempt" = 6 ] && exit 1
              sleep 65
            done
          done
      - name: Job summary
        if: always()
        run: |
          for p in deepgram groq; do
            if [ -f "packages/voice/eval-out/live-human/$p/report.md" ]; then
              cat "packages/voice/eval-out/live-human/$p/report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voice-stt-record-human
          path: |
            packages/voice/fixtures/stt-cache-human/deepgram
            packages/voice/fixtures/stt-cache-human/groq
            packages/voice/eval-out/live-human
          if-no-files-found: ignore

  live:
    if: github.event_name == 'workflow_dispatch' && !inputs.record && !inputs.trials
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - name: Live mode (audio through the provider)
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        # Exits 3 and fails this job when recordings are missing, so a green run always has scores.
        run: npm run eval -w @gavel/voice -- --mode live --provider "${{ inputs.provider }}" --out eval-out/live
      - name: Job summary
        if: always()
        run: |
          if [ -f packages/voice/eval-out/live/report.md ]; then
            cat packages/voice/eval-out/live/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voice-eval-live
          path: packages/voice/eval-out/live
          if-no-files-found: ignore

  trials:
    # Option trials for the speech-to-text providers: every variant records both clip sets and is
    # scored with the same parser. Nothing is written to the committed caches; the winner is chosen
    # on both sets together and then recorded with the record jobs above.
    if: github.event_name == 'workflow_dispatch' && inputs.trials
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - name: Install speech synthesizer and ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg jq
      - name: Render the eSpeak clips and convert the human-like clips (noise-free, not a real-room test)
        run: |
          bash packages/voice/scripts/render-clips.sh
          mkdir -p "$RUNNER_TEMP/human-wav"
          for f in packages/voice/fixtures/audio-human/*.mp3; do
            id="$(basename "$f" .mp3)"
            ffmpeg -nostdin -y -v error -i "$f" -af "adelay=300|300,apad=pad_dur=0.3" \
              -ar 16000 -ac 1 -c:a pcm_s16le "$RUNNER_TEMP/human-wav/$id.wav"
          done
      - name: Record and score every variant on both clip sets
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HUMAN_WAV: ${{ runner.temp }}/human-wav
          ONLY: ${{ inputs.only }}
        run: |
          DG_BASE='language=en&punctuate=false&smart_format=false'
          KEYTERMS='keyterm=paddle&keyterm=bidder&keyterm=hundred&keyterm=thousand&keyterm=fifty&keyterm=fifteen&keyterm=seventy%20five'
          KEYWORDS='keywords=paddle:2&keywords=bidder:2&keywords=hundred:2&keywords=thousand:2&keywords=fifty:2&keywords=fifteen:2'
          HINT='Spoken bids at an auction: paddle eight, six hundred dollars. Bidder number twenty, two thousand. Amounts are said in words.'
          run_variant() {
            name="$1"; provider="$2"
            if [ -n "$ONLY" ] && ! printf '%s' "$name" | grep -Eq "$ONLY"; then return 0; fi
            for set in espeak human; do
              if [ "$set" = human ]; then dir="$HUMAN_WAV"; else dir="$PWD/packages/voice/fixtures/audio/recordings"; fi
              for attempt in 1 2 3 4 5 6; do
                if G5_AUDIO_DIR="$dir" npm run eval -w @gavel/voice -- --mode live --provider "$provider" \
                  --record "fixtures/stt-cache-trial/$set-$name" --resume true \
                  --out "eval-out/trials/$set-$name/$provider"; then
                  break
                fi
                [ "$attempt" = 6 ] && { echo "variant $name ($set) failed"; return 0; }
                sleep 65
              done
            done
          }
          G5_DEEPGRAM_QUERY="model=nova-2&$DG_BASE" run_variant dg-nova2-base deepgram
          G5_DEEPGRAM_QUERY="model=nova-3&$DG_BASE" run_variant dg-nova3-plain deepgram
          G5_DEEPGRAM_QUERY="model=nova-3&language=en&punctuate=true&smart_format=true" run_variant dg-nova3-prod deepgram
          G5_DEEPGRAM_QUERY="model=nova-3&language=en&punctuate=true&smart_format=true&numerals=true" run_variant dg-nova3-numerals deepgram
          G5_DEEPGRAM_QUERY="model=nova-3&$DG_BASE&$KEYTERMS" run_variant dg-nova3-keyterm deepgram
          G5_DEEPGRAM_QUERY="model=nova-2&$DG_BASE&$KEYWORDS" run_variant dg-nova2-keywords deepgram
          G5_DEEPGRAM_QUERY="model=nova-3&language=en&punctuate=true&smart_format=false" run_variant dg-nova3-punct deepgram
          run_variant gq-turbo-base groq
          G5_GROQ_TEMPERATURE=0 run_variant gq-turbo-temp0 groq
          G5_GROQ_MODEL=whisper-large-v3 run_variant gq-large-v3 groq
          G5_GROQ_PROMPT="$HINT" G5_GROQ_TEMPERATURE=0 run_variant gq-turbo-prompt groq
          G5_GROQ_MODEL=whisper-large-v3 G5_GROQ_PROMPT="$HINT" G5_GROQ_TEMPERATURE=0 run_variant gq-large-v3-prompt groq
          G5_GROQ_PROMPT='Auction bidding. Words heard: paddle, bidder number, dollars, hundred, thousand.' run_variant gq-turbo-prompt-b groq
          G5_GROQ_PROMPT='Bid at an auction, spoken as words.' run_variant gq-turbo-prompt-c groq
      - name: Trial summary
        if: always()
        run: |
          echo '| variant | provider | exact | wrong accept | recoverable | missed | confirm | auto wrong (room) |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- | --- | --- | --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          for f in packages/voice/eval-out/trials/*/*/report.json; do
            [ -f "$f" ] || continue
            v="$(basename "$(dirname "$(dirname "$f")")")"; p="$(basename "$(dirname "$f")")"
            jq -r --arg v "$v" --arg p "$p" '"| \($v) | \($p) | \(.metrics.exactRate) | \(.metrics.wrongAcceptRate) | \(.metrics.recoverableRate) | \(.metrics.missedBidRate) | \(.metrics.confirmRate) | \(.gated.autoWrongAcceptRate) |"' "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voice-stt-trials
          path: |
            packages/voice/fixtures/stt-cache-trial
            packages/voice/eval-out/trials
          if-no-files-found: ignore
