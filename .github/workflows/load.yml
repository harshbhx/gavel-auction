name: load
# L1 (100 simulated bidders in rounds) and L2 (identical-bid race) from packages/e2e/src/load.
# Pass limits: p95 ack under 250 ms, p99 under 600 ms, no lost or duplicate bid, RSS growth under
# 150 MB. The latency JSON is uploaded. Runs on manual dispatch and on pull requests that touch
# the harness.
#
# L1 is report-only on this shared CI runner: its timings and RSS growth vary with runner load,
# so the step is marked continue-on-error. The thresholds are enforced locally, and the measured
# numbers are still uploaded so regressions stay visible. L2 (identical-bid race) stays blocking
# on correctness: exactly one bid may win, with no lost or duplicate reply. Its latency and RSS
# checks are report-only on CI for the same reason as L1, so a gate step reads the JSON.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/e2e/src/load/**'
      - '.github/workflows/load.yml'

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: L1 (report-only on CI runners)
        continue-on-error: true
        env:
          GAVEL_LOAD_RUN: '1'
        run: npx vite-node packages/e2e/src/load/run.ts -- L1 --out load-latency-l1.json
      - name: L2 identical-bid race
        continue-on-error: true
        env:
          GAVEL_LOAD_RUN: '1'
        run: npx vite-node packages/e2e/src/load/run.ts -- L2 --out load-latency-l2.json
      - name: L2 race gate (correctness blocks, timing is report-only)
        run: |
          test -s load-latency-l2.json
          jq -e '[.reports[] | select(.scenario == "L2") | .checks[]
            | select(.ok == false and (.name | test("^(p95 ack|p99 ack|rss growth)$") | not))]
            | length == 0' load-latency-l2.json
      - name: Upload latency JSON
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: load-latency
          path: |
            load-latency-l1.json
            load-latency-l2.json
          if-no-files-found: warn
