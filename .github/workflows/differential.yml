name: differential
on:
  pull_request:
    paths:
      - 'packages/engine/**'
      - 'reference/python/**'
      - '.github/workflows/differential.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: differential-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup
      - name: Export 2000 seeded scenarios from the Python reference
        run: python3 reference/python/scenario_export.py --seed 20261104 --n 2000 > "$RUNNER_TEMP/scenarios.jsonl"
      - name: Compare the TypeScript engine on the same scenarios
        env:
          GAVEL_DIFFERENTIAL_FILE: ${{ runner.temp }}/scenarios.jsonl
        run: npx vitest run --project 'unit:engine' differential
