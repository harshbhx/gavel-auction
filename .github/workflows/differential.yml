name: differential
# The pinned-seed comparison also runs on every pull request as the `differential` job in ci.yml,
# which is part of the `required` roll-up. This workflow adds the weekly and manual rotating seed.
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed for the rotating run (default is derived from the run id)'
        required: false

permissions:
  contents: read

concurrency:
  group: differential-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup
      - name: Export 2000 scenarios from the Python reference with the pinned seed
        run: python3 reference/python/scenario_export.py --seed 20261104 --n 2000 > "$RUNNER_TEMP/scenarios.jsonl"
      - name: Compare the TypeScript engine on the pinned seed
        env:
          GAVEL_DIFFERENTIAL_FILE: ${{ runner.temp }}/scenarios.jsonl
        run: npx vitest run --project 'unit:engine' differential
      # A second run with a seed that changes every run, so the comparison is not limited to one
      # fixed sample. It runs on the schedule and by hand only, so a divergence it finds does not
      # block unrelated pull requests. The seed is printed; replay it with workflow_dispatch and the seed input.
      - name: Export 2000 scenarios with a rotating seed
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          INPUT_SEED: ${{ github.event.inputs.seed }}
        run: |
          seed="${INPUT_SEED:-$(( GITHUB_RUN_ID % 2000000000 ))}"
          echo "differential rotating seed=$seed"
          python3 reference/python/scenario_export.py --seed "$seed" --n 2000 > "$RUNNER_TEMP/scenarios-rotating.jsonl"
      - name: Compare the TypeScript engine on the rotating seed
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          GAVEL_DIFFERENTIAL_FILE: ${{ runner.temp }}/scenarios-rotating.jsonl
        run: npx vitest run --project 'unit:engine' differential
