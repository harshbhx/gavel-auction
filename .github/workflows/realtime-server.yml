name: realtime-server
on:
  pull_request:
    paths:
      - 'packages/server/**'
      - 'packages/shared/**'
      - '.github/workflows/realtime-server.yml'
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/shared/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck -w @gavel/server
      - run: npm run test -w @gavel/server
