name: silent-video
# Renders the silent product video of GAVEL (GFX-14): 100 to 150 seconds, 1920x1080, no audio at all
# (Devpost forbids third-party music; the voice-over is added later). Manual dispatch only, no secrets.
# 1. Builds the web app and boots the real server (judge rooms on, simulated holds, fake payments, a
#    memory store) on loopback, then records the judge flow with one browser per actor (graphics/
#    motion-silent/record.mjs) and runs the judge API calls against a second keyed server instance
#    (api-run.mjs; the key is generated here and masked).
# 2. Composes the broadside cards, the captions and the recorded panes with ffmpeg (compose.mjs).
# Artifacts: silent-raw (the recording, reusable through the raw_run input) and silent-video (MP4, WebM,
# poster, SRT, contact sheets, report). Commit the final files to brand/video/silent-cut/.
on:
  workflow_dispatch:
    inputs:
      raw_run:
        description: 'Reuse the silent-raw artifact of this run id and only compose (skips the recording)'
        required: false
        default: ''
        type: string
      record_only:
        description: 'Only record, do not compose'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: silent-video
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  video:
    if: ${{ github.repository == 'harshbhx/gavel-auction' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WEB_PORT: '4180'
      API_PORT: '8787'
      KEYED_PORT: '8788'
      RAW: ${{ github.workspace }}/out/raw
      FINAL: ${{ github.workspace }}/out/final
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Playwright, chromium and ffmpeg
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - uses: ./.github/actions/setup
        if: ${{ inputs.raw_run == '' }}
      - name: Build the web app against the local API
        if: ${{ inputs.raw_run == '' }}
        working-directory: packages/web
        env:
          VITE_API_BASE: http://127.0.0.1:8787
          VITE_WS_BASE: ws://127.0.0.1:8787
          VITE_SANDBOX: 'true'
          VITE_PAYMENTS: fake
          VITE_ALLOW_FAKE: 'true'
          VITE_PAYPAL_CLIENT_ID: sandbox-client
        run: npx vite build
      - name: Start the servers
        if: ${{ inputs.raw_run == '' }}
        run: |
          JUDGE_KEY="$(openssl rand -hex 24)"
          echo "::add-mask::$JUDGE_KEY"
          echo "JUDGE_KEY=$JUDGE_KEY" >> "$GITHUB_ENV"
          start_server() { # port, extra env pairs...
            local port="$1"; shift
            (cd packages/server && env NODE_ENV=test PORT="$port" PUBLIC_URL="http://127.0.0.1:$port" \
              TOKEN_SECRET="$(openssl rand -hex 32)" ADMIN_KEY="$(openssl rand -hex 24)" \
              STORE=memory PAYMENTS=fake PAYPAL_ENV=sandbox JUDGE_ROOMS=true JUDGE_SIM_HOLDS=1 \
              CORS_ORIGINS="http://127.0.0.1:$WEB_PORT" WEB_ORIGIN="http://127.0.0.1:$WEB_PORT" "$@" \
              npx vite-node src/main.ts > "$GITHUB_WORKSPACE/server-$port.log" 2>&1 &)
          }
          start_server "$API_PORT"
          start_server "$KEYED_PORT" JUDGE_KEY="$JUDGE_KEY"
          (cd packages/web && npx vite preview --host 127.0.0.1 --port "$WEB_PORT" --strictPort > "$GITHUB_WORKSPACE/web.log" 2>&1 &)
          for url in "http://127.0.0.1:$API_PORT/healthz" "http://127.0.0.1:$KEYED_PORT/healthz" "http://127.0.0.1:$WEB_PORT/"; do
            for i in $(seq 1 60); do curl -fsS -o /dev/null "$url" && break; sleep 2; done
            curl -fsS -o /dev/null "$url"
          done
          curl -fsS "http://127.0.0.1:$API_PORT/api/judge/capabilities"; echo
      - name: Record the judge flow
        if: ${{ inputs.raw_run == '' }}
        run: |
          mkdir -p "$RAW"
          PW_DIR="$RUNNER_TEMP/pw" WEB_URL="http://127.0.0.1:$WEB_PORT" API_URL="http://127.0.0.1:$API_PORT" node graphics/motion-silent/record.mjs "$RAW" | tee "$RAW/record.log"
      - name: Run the judge API calls
        if: ${{ inputs.raw_run == '' }}
        run: |
          API_URL="http://127.0.0.1:$KEYED_PORT" node graphics/motion-silent/api-run.mjs "$RAW/api.json"
          cat "$RAW/api.json"
      - name: Upload the raw recording
        if: ${{ !cancelled() && inputs.raw_run == '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: silent-raw
          path: |
            out/raw
            server-*.log
            web.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - name: Fetch the raw recording of an earlier run
        if: ${{ inputs.raw_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RAW"
          gh run download "${{ inputs.raw_run }}" -R "$GITHUB_REPOSITORY" -n silent-raw -D "$RUNNER_TEMP/rawdl"
          cp -r "$RUNNER_TEMP/rawdl/out/raw/." "$RAW/" 2>/dev/null || cp -r "$RUNNER_TEMP/rawdl/." "$RAW/"
          ls "$RAW" | head
      - name: Compose the video
        if: ${{ !inputs.record_only }}
        run: |
          mkdir -p "$FINAL"
          PW_DIR="$RUNNER_TEMP/pw" node graphics/motion-silent/compose.mjs "$RAW" "$FINAL"
      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### silent-video'
            if [ -f "$RAW/record.log" ]; then echo '```'; tail -n 30 "$RAW/record.log"; echo '```'; fi
            if [ -f "$FINAL/report.txt" ]; then echo '```'; cat "$FINAL/report.txt"; echo '```'; fi
            find "$FINAL" -maxdepth 1 -type f -printf '%s %f\n' 2>/dev/null | sort -k2
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the video
        if: ${{ !cancelled() && !inputs.record_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: silent-video
          path: out/final
          if-no-files-found: error
          retention-days: 30
      - name: Stop the servers
        if: ${{ always() }}
        run: pkill -f vite-node || true; pkill -f "vite preview" || true
