name: srv39-repeat
# Temporary proof for issue 2493: the SRV-39 unsold-hammer test ten times under CPU load.
on:
  pull_request:
    paths:
      - .github/workflows/srv39-repeat.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - name: Repeat the unsold-hammer test ten times with every core busy
        run: |
          for i in 1 2 3 4; do (timeout 600 sh -c 'while :; do :; done' &) ; done
          for i in $(seq 1 10); do
            echo "run $i"
            npx vitest run --project 'unit:server' boot-judge-sim-hammer -t 'unsold hammer' || exit 1
          done
