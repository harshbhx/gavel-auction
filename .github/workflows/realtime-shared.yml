name: realtime-shared
on:
  pull_request:
    paths:
      - 'packages/shared/**'
      - '.github/workflows/realtime-shared.yml'
  push:
    branches: [main]
    paths:
      - 'packages/shared/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck -w @gavel/shared
      - run: npm test -w @gavel/shared
