version: 2
# Weekly, grouped update PRs. Actions are pinned by sha; Dependabot bumps the sha and the comment.
#
# Policy (FIX-63): version updates are minor and patch only. Major bumps are done by hand in a
# dedicated pull request, because several of them need code or config changes (eslint 10, jsdom,
# commitlint, the github actions that pin deploy paths). The
# `ignore` lists below apply to version updates only; Dependabot security updates are not
# affected by them and keep arriving.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'ci(repo)'
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # These run in every job or in the deploy paths. Even minor bumps cannot be tested before
      # merge (the api-reports job went red on the bump), so they are updated by hand.
      - dependency-name: 'actions/checkout'
      - dependency-name: 'actions/setup-node'
      - dependency-name: 'gitleaks/gitleaks-action'
      - dependency-name: 'cloudflare/wrangler-action'
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(repo)'
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # A prettier minor reformats dozens of files and a playwright minor changes the browser
      # build, which moves every committed screenshot. Both are bumped by hand together with the
      # reformat or the new baselines (label visual-update).
      - dependency-name: 'prettier'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'playwright'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@playwright/test'
        update-types: ['version-update:semver-minor']
      # A TypeScript minor tightens typed-array and lib typings (5.9 rejected `new Blob([u8])`),
      # and typescript-eslint minors track it. Both are bumped by hand in one dedicated pull
      # request that carries the code fixes (issue 2453).
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'typescript-eslint'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@typescript-eslint/*'
        update-types: ['version-update:semver-minor']
  - package-ecosystem: npm
    directory: /docsite
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(docs)'
    groups:
      # The fumadocs packages pin each other with exact peer ranges (fumadocs-ui requires
      # fumadocs-core at the same version), so they must bump in one pull request (issue 2454).
      # Group order matters: a dependency joins the first group that matches it.
      fumadocs:
        patterns: ['fumadocs-*', '@fumadocs/*']
        update-types: [minor, patch]
      docsite-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
