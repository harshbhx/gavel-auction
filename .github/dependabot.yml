version: 2
# Weekly, grouped update PRs. Actions are pinned by sha; Dependabot bumps the sha and the comment.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(repo)'
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(repo)'
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /docsite
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(docs)'
    groups:
      docsite-minor-and-patch:
        update-types: [minor, patch]
