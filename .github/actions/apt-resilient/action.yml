name: apt-resilient
description: Make apt retry, avoid the Azure mirror host and tolerate a flaky index update
runs:
  using: composite
  steps:
    - name: Harden apt
      shell: bash
      run: |
        printf '%s\n' \
          'Acquire::Retries "5";' \
          'Acquire::http::Timeout "20";' \
          'Acquire::https::Timeout "20";' \
          'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
        for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
          if [ -f "$f" ]; then
            sudo sed -i 's#http://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$f"
          fi
        done
        for attempt in 1 2 3; do
          if sudo apt-get update -qq; then
            break
          fi
          echo "apt-get update failed (attempt $attempt of 3)"
          if [ "$attempt" -lt 3 ]; then
            sleep 10
          fi
        done
        exit 0
