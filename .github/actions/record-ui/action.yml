name: record-ui
description: >-
  Build the web app against a local API, boot the real server on loopback (judge rooms on, simulated
  holds, fake payments, memory store, a throwaway judge key that is masked and dies with the runner),
  record the judge flow with one browser per actor (graphics/motion-silent/record.mjs) and run the
  judge API calls (api-run.mjs). Shared by silent-video.yml and launch-film.yml. No secrets.
inputs:
  raw:
    description: Directory for the recording (frames per actor, meta.json, api.json, record.log)
    required: true
  pw_dir:
    description: Directory where playwright is installed (PW_DIR of the recorder)
    required: true
  web_port:
    default: '4180'
  api_port:
    default: '8787'
  keyed_port:
    default: '8788'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
    - name: Build the web app against the local API
      shell: bash
      working-directory: packages/web
      env:
        VITE_API_BASE: http://127.0.0.1:${{ inputs.api_port }}
        VITE_WS_BASE: ws://127.0.0.1:${{ inputs.api_port }}
        VITE_SANDBOX: 'true'
        VITE_PAYMENTS: fake
        VITE_ALLOW_FAKE: 'true'
        VITE_PAYPAL_CLIENT_ID: sandbox-client
      run: npx vite build
    - name: Start the servers
      shell: bash
      env:
        WEB_PORT: ${{ inputs.web_port }}
        API_PORT: ${{ inputs.api_port }}
        KEYED_PORT: ${{ inputs.keyed_port }}
      run: |
        JUDGE_KEY="$(openssl rand -hex 24)"
        echo "::add-mask::$JUDGE_KEY"
        echo "JUDGE_KEY=$JUDGE_KEY" >> "$GITHUB_ENV"
        start_server() { # port, extra env pairs...
          local port="$1"; shift
          (cd packages/server && env NODE_ENV=test PORT="$port" PUBLIC_URL="http://127.0.0.1:$port" \
            TOKEN_SECRET="$(openssl rand -hex 32)" ADMIN_KEY="$(openssl rand -hex 24)" \
            STORE=memory PAYMENTS=fake PAYPAL_ENV=sandbox JUDGE_ROOMS=true JUDGE_SIM_HOLDS=1 \
            JUDGE_KEY="$JUDGE_KEY" \
            CORS_ORIGINS="http://127.0.0.1:$WEB_PORT" WEB_ORIGIN="http://127.0.0.1:$WEB_PORT" "$@" \
            npx vite-node src/main.ts > "$GITHUB_WORKSPACE/server-$port.log" 2>&1 &)
        }
        # The web app talks to API_PORT (keyless rooms and the /try key field); the API card is typed
        # against KEYED_PORT so its room never shows up in the recorded hub.
        start_server "$API_PORT"
        start_server "$KEYED_PORT"
        (cd packages/web && npx vite preview --host 127.0.0.1 --port "$WEB_PORT" --strictPort > "$GITHUB_WORKSPACE/web.log" 2>&1 &)
        for url in "http://127.0.0.1:$API_PORT/healthz" "http://127.0.0.1:$KEYED_PORT/healthz" "http://127.0.0.1:$WEB_PORT/"; do
          for i in $(seq 1 60); do curl -fsS -o /dev/null "$url" && break; sleep 2; done
          curl -fsS -o /dev/null "$url"
        done
        curl -fsS "http://127.0.0.1:$API_PORT/api/judge/capabilities"; echo
    - name: Record the judge flow
      shell: bash
      env:
        RAW: ${{ inputs.raw }}
        PW_DIR: ${{ inputs.pw_dir }}
        WEB_URL: http://127.0.0.1:${{ inputs.web_port }}
        API_URL: http://127.0.0.1:${{ inputs.api_port }}
      run: |
        mkdir -p "$RAW"
        node graphics/motion-silent/record.mjs "$RAW" | tee "$RAW/record.log"
    - name: Run the judge API calls
      shell: bash
      env:
        RAW: ${{ inputs.raw }}
        API_URL: http://127.0.0.1:${{ inputs.keyed_port }}
      run: |
        node graphics/motion-silent/api-run.mjs "$RAW/api.json"
        cat "$RAW/api.json"
