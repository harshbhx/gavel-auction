<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAVEL - Devpost preview</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--ink:#242b33;--muted:#5f6b76;--line:#dfe3e7;--blue:#003e54;--chip:#e8f1f5}
@media (prefers-color-scheme:dark){:root{--bg:#14181c;--card:#1c2127;--ink:#e6e9ec;--muted:#9aa5af;--line:#2b333b;--blue:#7cc4e0;--chip:#24323a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
.note{background:#fff3cd;color:#5c4a00;padding:8px 16px;font-size:14px;text-align:center}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 48px}
header{padding:28px 0 8px}h1.title{font-size:34px;margin:0 0 4px}.tag{color:var(--muted);font-size:18px;margin:0}
.strip{display:flex;gap:8px;overflow-x:auto;padding:16px 0}.strip img{height:110px;aspect-ratio:3/2;object-fit:cover;border:1px solid var(--line);border-radius:4px;cursor:pointer;flex:none}
.hero{width:100%;aspect-ratio:3/2;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.cap{color:var(--muted);font-size:14px;margin:6px 0 0;min-height:22px}
.grid{display:grid;grid-template-columns:1fr;gap:24px}
@media(min-width:800px){.grid{grid-template-columns:1fr 260px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 24px}
.desc h2{font-size:22px;margin:28px 0 8px;color:var(--blue)}.desc h2:first-child{margin-top:0}.desc h3{font-size:18px;margin:20px 0 6px}
.desc img{max-width:100%;height:auto;display:block;margin:12px 0;border:1px solid var(--line)}
.desc code{background:var(--chip);padding:1px 5px;border-radius:3px;font-size:.92em}.desc a,aside a{color:var(--blue)}
.desc ul,.desc ol{padding-left:22px}.desc p{margin:10px 0}
aside h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}.chip{background:var(--chip);color:var(--blue);padding:2px 10px;border-radius:12px;font-size:13px}
aside ul{list-style:none;padding:0;margin:0 0 20px}aside li{margin:6px 0;font-size:14px;word-break:break-word}
.btn{display:block;text-align:center;background:var(--blue);color:var(--bg);padding:8px;border-radius:4px;text-decoration:none;margin-bottom:8px;font-size:14px}
</style></head><body>
<div class="note">Preview only: a rough imitation of the Devpost project page. Not final, not merged to main.</div>
<div class="wrap">
<header><h1 class="title">GAVEL</h1><p class="tag" id="tagline"></p></header>
<img class="hero" id="hero" alt=""><p class="cap" id="cap"></p><div class="strip" id="strip"></div>
<div class="grid"><main class="card desc" id="desc"></main>
<aside class="card"><h4>Try it out</h4><div id="try"></div><h4>Built with</h4><div class="chips" id="chips"></div></aside></div>
</div>
<script type="text/plain" id="md">@@MD@@</script>
<script>
var RAW='https://raw.githubusercontent.com/harshbhx/gavel-auction/devpost/preview/';
var local=location.protocol==='file:';
function img(p){return local?'../../'+p:RAW+p}
var TAG='Every bid is a PayPal hold. Only the winner pays.';
var GAL=[['01-hero','GAVEL is a live auction where every bid is a PayPal authorization hold and only the winner is charged, at the hammer.'],['02-how-it-works','Four moves: hold, bid, hammer, receipt.'],['03-architecture','One bid, four hops.'],['04-judge-flow','Try it in two minutes, no login.'],['05-audit-and-verify','Do not trust, verify.'],['06-partners','Built with the best.'],['07-open-data-and-gates','The evidence is open.'],['08-ending','Try it. Verify it. No login.']];
var TRY=[['Judge panel (live sandbox room)','https://gavel.dualmindlab.tech/try'],['Scripted demo','https://gavel.dualmindlab.tech/demo/scripted'],['Docs','https://docs.gavel.dualmindlab.tech'],['API reference','https://docs.gavel.dualmindlab.tech/api-reference'],['Call the API as a judge','https://docs.gavel.dualmindlab.tech/docs/judges/call-the-api'],['Evidence Explorer','https://huggingface.co/spaces/harshbhx/gavel-evidence-explorer'],['GitHub repository','https://github.com/harshbhx/gavel-auction']];
var TAGS='typescript,node.js,react,vite,python,paypal,paypal-orders-api,paypal-payments-api,paypal-js-sdk,cloudflare-workers,render,ag-grid,hugging-face,deepgram,groq,websockets,openapi,apimatic,vitest,playwright,github-actions,next.js,fumadocs'.split(',');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
// Inline renderer: ONLY the Devpost subset: h2/h3, bold, italic, inline code, links, images, bullet/numbered lists, paragraphs. Raw HTML is escaped.
function inline(s){
  s=esc(s);
  var codes=[];s=s.replace(/`([^`]+)`/g,function(_,c){codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,function(_,a,u){var src=u;if(local&&u.indexOf(RAW)===0)src='../../'+u.slice(RAW.length);return '<img alt="'+a+'" src="'+src+'">'});
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
  return s.replace(/\u0000(\d+)\u0000/g,function(_,i){return '<code>'+codes[i]+'</code>'});
}
function render(md){
  var out=[],lines=md.split('\n'),list=null,para=[];
  function flushP(){if(para.length){out.push('<p>'+inline(para.join(' '))+'</p>');para=[]}}
  function flushL(){if(list){out.push('</'+list+'>');list=null}}
  lines.forEach(function(l){var m;
    if(!l.trim()){flushP();flushL();return}
    if((m=/^(#{2,3}) (.*)$/.exec(l))){flushP();flushL();out.push('<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>');return}
    if((m=/^[-*] (.*)$/.exec(l))){flushP();if(list!=='ul'){flushL();out.push('<ul>');list='ul'}out.push('<li>'+inline(m[1])+'</li>');return}
    if((m=/^\d+\. (.*)$/.exec(l))){flushP();if(list!=='ol'){flushL();out.push('<ol>');list='ol'}out.push('<li>'+inline(m[1])+'</li>');return}
    if(/^!\[.*\]\(.*\)$/.test(l.trim())){flushP();flushL();out.push(inline(l.trim()));return}
    flushL();para.push(l.trim());
  });flushP();flushL();return out.join('\n');
}
document.getElementById('tagline').textContent=TAG;
document.getElementById('desc').innerHTML=render(document.getElementById('md').textContent);
var strip=document.getElementById('strip'),hero=document.getElementById('hero'),cap=document.getElementById('cap');
function show(i){hero.src=img('assets/devpost-kit/gallery/'+GAL[i][0]+'.png');cap.textContent=(i+1)+'/'+GAL.length+': '+GAL[i][1]}
GAL.forEach(function(g,i){var im=document.createElement('img');im.src=img('assets/devpost-kit/gallery/'+g[0]+'.png');im.alt=g[1];im.onclick=function(){show(i)};strip.appendChild(im)});
show(0);
document.getElementById('try').innerHTML=TRY.map(function(t,i){return i<2?'<a class="btn" target="_blank" href="'+t[1]+'">'+t[0]+'</a>':''}).join('')+'<ul>'+TRY.slice(2).map(function(t){return '<li><a target="_blank" href="'+t[1]+'">'+t[0]+'</a></li>'}).join('')+'</ul>';
document.getElementById('chips').innerHTML=TAGS.map(function(t){return '<span class="chip">'+t+'</span>'}).join('');
</script></body></html>
