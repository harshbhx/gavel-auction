<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">GAVEL</title>
  <desc id="desc">GAVEL: every bid is a PayPal hold, only the winner pays. A bid ladder shows the winner captured at the winning price and every other hold voided.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#e09a1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#3b5bdb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b5bdb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <!-- gavel mark -->
  <g transform="translate(84 92) rotate(-30 48 48)">
    <rect x="10" y="20" width="76" height="34" rx="8" fill="url(#gold)"/>
    <rect x="2" y="16" width="14" height="42" rx="5" fill="#ffd27a"/>
    <rect x="80" y="16" width="14" height="42" rx="5" fill="#ffd27a"/>
    <rect x="42" y="54" width="12" height="70" rx="6" fill="#c9861a"/>
  </g>
  <rect x="70" y="214" width="96" height="12" rx="6" fill="#c9861a" opacity="0.9"/>

  <!-- wordmark and promise -->
  <text x="200" y="152" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="10" fill="#ffffff">GAVEL</text>
  <text x="204" y="204" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="600" fill="#ffd27a">Every bid is a PayPal hold.</text>
  <text x="204" y="244" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="600" fill="#ffffff">Only the winner pays.</text>
  <text x="204" y="300" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#9fb0d0">Live auctions with AUTHORIZE holds, a crash-safe settlement saga</text>
  <text x="204" y="326" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#9fb0d0">and a hash-chained audit trail. PayPal sandbox only.</text>

  <!-- bid ladder card -->
  <g transform="translate(820 70)">
    <rect width="380" height="260" rx="18" fill="#0f1830" stroke="#2c3a5e" stroke-width="1.5"/>
    <text x="24" y="40" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#9fb0d0">LOT 7 - SOLD AT $350</text>
    <line x1="24" y1="58" x2="356" y2="58" stroke="#2c3a5e"/>

    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
      <rect x="16" y="74" width="348" height="50" rx="10" fill="#12351f" stroke="#2f9e58"/>
      <text x="34" y="105" font-size="17" font-weight="700" fill="#ffffff">Bidder A</text>
      <text x="150" y="105" font-size="17" fill="#c7f2d4">$350 of $500</text>
      <rect x="262" y="88" width="88" height="24" rx="12" fill="#2f9e58"/>
      <text x="306" y="105" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">CAPTURED</text>

      <rect x="16" y="134" width="348" height="50" rx="10" fill="#172243"/>
      <text x="34" y="165" font-size="17" font-weight="700" fill="#c6d0e6">Bidder B</text>
      <text x="150" y="165" font-size="17" fill="#8a98b8">hold $340</text>
      <rect x="262" y="148" width="88" height="24" rx="12" fill="#3a4766"/>
      <text x="306" y="165" font-size="12" font-weight="700" text-anchor="middle" fill="#dfe6f5">VOIDED</text>

      <rect x="16" y="194" width="348" height="50" rx="10" fill="#172243"/>
      <text x="34" y="225" font-size="17" font-weight="700" fill="#c6d0e6">Bidder C</text>
      <text x="150" y="225" font-size="17" fill="#8a98b8">hold $300</text>
      <rect x="262" y="208" width="88" height="24" rx="12" fill="#3a4766"/>
      <text x="306" y="225" font-size="12" font-weight="700" text-anchor="middle" fill="#dfe6f5">VOIDED</text>
    </g>
  </g>
</svg>
