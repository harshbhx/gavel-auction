            example:
              paused: true
      responses:
        '200':
          description: New state.
          content:
            application/json:
              schema:
                type: object
                required: [paused]
                properties:
                  paused:
                    type: boolean
              example:
                paused: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  # --- FEAT-60 judge API keys: begin (separate block, keep edits here apart from lint passes) ---
  /api/judge/rooms/{id}/bids:
    post:
      tags: [Judge rooms]
      operationId: placeJudgeBid
      summary: Place a bid in a judge room over HTTP
      description: |
        Bid with plain HTTP, for curl and generated clients that cannot open the WebSocket (the
        socket needs a browser `Origin`; this route does not, and the socket rules are
        unchanged). Send the session token from `POST /api/judge/join` as a bearer token, after
        the bidder has a hold (`POST /api/judge/rooms/{id}/sim-hold`). The bid takes the same
        path as a socket bid: the per-bidder bid limit, the registered check and the auction
        engine all apply. `amount` is whole cents. `mid` is optional; send the same `mid` again
        to retry safely, the room answers with the original result and records nothing twice.

        A bid the engine refuses (too low, over your ceiling, lot closed) is 409 with
        `accepted: false` and a `reason`. Sending a `mid` again with a different `amount` is 409
        `conflict` (`{error, code, message}`). Bids sent too fast are 429 `rate_limited` with
        `Retry-After`. When the room cannot take the bid (`auction_full`, `store_unavailable`,
        `room_full`) the answer is 503. Only session tokens work here, and only for judge
        rooms: any other auction answers 404. A judge key is not needed on this route.
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/AuctionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount]
              properties:
                amount:
                  type: integer
                  minimum: 1
                  maximum: 99999999999
                  description: Bid in cents.
                mid:
                  type: string
                  pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
                  description: Optional message id (ULID) that makes a retry safe.
            example:
              amount: 1500
      responses:
        '200':
          description: The bid was accepted.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, mid, bidId, amount, seq]
                properties:
                  accepted:
                    type: boolean
                    const: true
                  mid:
                    type: string
                  bidId:
                    type: string
                  amount:
                    type: integer
                    description: The accepted bid in cents.
                  seq:
                    type: integer
                    description: Position of the bid in the room's event log.
              example:
                accepted: true
                mid: 01JC5ZR1B2C3D4E5F6G7H8J9K0
                bidId: 01JC5ZR1B2C3D4E5F6G7H8J9K1
                amount: 1500
                seq: 7
        '202':
          description: The room is holding the bid for the bidder to confirm; nothing was placed yet.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, pending, mid]
                properties:
                  accepted:
                    type: boolean
                    const: false
                  pending:
                    type: boolean
                    const: true
                  mid:
                    type: string
              example:
                accepted: false
                pending: true
                mid: 01JC5ZR1B2C3D4E5F6G7H8J9K0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The engine refused the bid (`bid_rejected`: `accepted` is false and `reason` says
            why), or the same `mid` was reused with a different amount (`conflict`).
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required: [accepted, error, mid, reason, retryable]
                    properties:
                      accepted:
                        type: boolean
                        const: false
                      error:
                        type: string
                        const: bid_rejected
                      mid:
                        type: string
                      reason:
                        $ref: '#/components/schemas/ErrorCode'
                      retryable:
                        type: boolean
                  - $ref: '#/components/schemas/Error'
              examples:
                rejected:
                  summary: The engine refused the bid
                  value:
                    accepted: false
                    error: bid_rejected
                    mid: 01JC5ZR1B2C3D4E5F6G7H8J9K0
                    reason: below_increment
                    retryable: false
                conflict:
                  summary: The same mid with another amount
                  value:
                    error: conflict
                    code: conflict
                    message: That bid id was already used with a different amount. Send a new bid id.
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          description: >-
            The room could not take the bid (`auction_full`, `store_unavailable`, `room_full`).
            Retry after a moment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: store_unavailable
                code: store_unavailable
                message: Bid refused
  /api/judge/keys:
    get:
      tags: [Judge rooms, Operator]
      operationId: listJudgeKeys
      summary: List judge keys
      description: |
        Operator only (`X-Admin-Key`). Lists every judge key by id with its label, limits and
        state. The secret and its hash are never returned. A judge key on this route is 401.
      security:
        - adminKey: []
      responses:
        '200':
          description: The keys.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [id, label, maxRooms, perHour, roomsLive, revoked, expired]
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        maxRooms:
                          type: integer
                        perHour:
                          type: integer
                        roomsLive:
                          type: integer
                        revoked:
                          type: boolean
                        expired:
                          type: boolean
                        expiresAt:
                          type: [string, 'null']
                          format: date-time
                          description: When the key stops working. `null` means it never expires.
              example:
                keys:
                  - id: a1b2c3d4
                    label: Asha
                    maxRooms: 2
                    perHour: 10
                    roomsLive: 1
                    revoked: false
                    expired: false
                    expiresAt: '2026-11-30T23:59:00Z'
                  - id: legacy
                    label: shared judge key
                    maxRooms: 10
                    perHour: 100
                    roomsLive: 0
                    revoked: false
                    expired: false
                    expiresAt: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/judge/keys/{keyId}/revoke:
    post:
      tags: [Judge rooms, Operator]
      operationId: revokeJudgeKey
      summary: Revoke a judge key
      description: |
        Operator only (`X-Admin-Key`). The key is refused from now on (401 `judge_key_revoked`)
        and stays revoked after a restart. Rooms it already opened run until they end. A judge
        key on this route is 401.
      security:
        - adminKey: []
      parameters:
        - name: keyId
          in: path
          required: true
          description: The 8 character id inside the key (`gvl_judge_<id>_<secret>`), or `legacy`.
          schema:
            type: string
      responses:
        '200':
          description: The key is revoked.
          content:
            application/json:
              schema:
                type: object
                required: [id, revoked]
                properties:
                  id:
                    type: string
                  revoked:
                    type: boolean
                    const: true
              example:
                id: a1b2c3d4
                revoked: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          description: >-
            The revoke could not be saved (`store_unavailable`). Nothing changed and the key is
            still usable; try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: store_unavailable
                code: store_unavailable
                message: the revoke could not be saved, try again
  # --- FEAT-60 judge API keys: end ---
  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness
      description: >-
        Always 200 while the process runs. Never rate limited. Answers on any HTTP method
        (the host matches the path only); use `GET`.
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
              example:
                status: ok
  /readyz:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness
      description: >-
        200 when every migration is applied and the store answers; 503 otherwise. Never rate
        limited. Answers on any HTTP method (the host matches the path only); use `GET`.
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
              example:
                status: ok
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                type: object
                required: [status, reason]
                properties:
                  status:
                    type: string
                    const: unavailable
                  reason:
                    type: string
                    enum: [migrations, store]
              example:
                status: unavailable
                reason: store
  /version:
    get:
      tags: [Health]
      operationId: getVersion
      summary: Deployed build
      description: >-
        The commit the running build was made from, or `unknown`. Never rate limited. Answers
        on any HTTP method (the host matches the path only); use `GET`.
      responses:
        '200':
          description: Build sha.
          content:
            application/json:
              schema:
                type: object
                required: [sha]
                properties:
                  sha:
                    type: string
              example:
                sha: '1e516633'
  /warmup:
    get:
      tags: [Health]
      operationId: warmup
      summary: Warm the host's dependencies
      description: No credential. Runs the warm-up steps in parallel within a 3 second budget; 200 when all are warm, 503 otherwise.
      responses:
        '200':
          description: All steps warm.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarmupReport'
        '503':
          description: A step failed or the budget ran out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarmupReport'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/export:
    get:
      tags: [Operator, Export]
      operationId: adminExport
      summary: Private ledger and payment state export
      description: |
        Operator only. Output carries every bidder's ceiling, hold reference and bid
        transcript: never publish it. Modes by query: `auction=<id>` (the hash-chained ledger
        as NDJSON, last line `{head}`); `list=1` (all auction ids); `kind=payments&auction=<id>`
        (settlement journal and holds); `kind=payments-global` (webhook event ids and kill
        switch); `kind=roomlog&auction=<id>` (room events as NDJSON, last line `{end}`).
        Secret-looking keys are replaced with `[redacted]` and webhook bodies are dropped.
        Errors are `{"error": "<code>"}`.
      security:
        - adminKey: []
      parameters:
        - name: auction
          in: query
          schema:
            type: string
            pattern: '^[0-9A-Za-z_-]{1,64}$'
          description: Auction id (`auctionId` is accepted as an alias).
        - name: list
          in: query
          description: Send `1` to list every auction id instead of exporting one auction.
          example: '1'
          schema:
            type: string
            const: '1'
        - name: kind
          in: query
          description: Which export to return. Without it, `auction` returns the ledger.
          example: payments
          schema:
            type: string
            enum: [payments, payments-global, roomlog]
      responses:
        '200':
          description: JSON or NDJSON depending on the mode.
          content:
            application/x-ndjson:
              schema:
                type: string
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                auctions:
                  - 01JC5ZP4M7Q8R9S0T1V2W3X4Y5
        '400':
          $ref: '#/components/responses/OperatorBadRequest'
        '401':
          $ref: '#/components/responses/OperatorUnauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/OperatorRateLimited'
        '500':
          $ref: '#/components/responses/OperatorInternal'
        '501':
          description: The host does not support this export mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: payments_unsupported
  /admin/replay-bundle:
    get:
      tags: [Operator, Export]
      operationId: adminReplayBundle
      summary: Replay bundle of one auction
      description: |
        Operator only. A self-contained bundle of the auction's ledger for replay and
        verification. Query `auctionId` is required. 404 when the ledger has no entry, 409
        `ledger_unverified` when the hash chain is broken, 500 `export_failed` when it cannot
        be read.
      security:
        - adminKey: []
      parameters:
        - name: auctionId
          in: query
          required: true
          description: Id of the auction to bundle.
          example: 01J9ZZ0000000000000000000A
          schema:
            type: string
            pattern: '^[0-9A-Za-z_-]{1,64}$'
      responses:
        '200':
          description: The bundle (format defined in `packages/shared/src/replay-bundle.ts`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayBundle'
        '400':
          $ref: '#/components/responses/OperatorBadRequest'
        '401':
          $ref: '#/components/responses/OperatorUnauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/ReplayLedgerUnverified'
        '429':
          $ref: '#/components/responses/OperatorRateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /metrics:
    get:
      tags: [Operator]
      operationId: getMetrics
      summary: Metrics snapshot (JSON)
      description: |
        Operator only: this route is not public. Own limit of 60 requests per minute on top of
        the host-wide limit.
      security:
        - adminKey: []
      responses:
        '200':
          description: The collector snapshot.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/OperatorUnauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/OperatorRateLimited'
      x-rate-limit:
        scope: whole route
        perMinute: 60
  /metrics/prometheus:
    get:
      tags: [Operator]
      operationId: getMetricsPrometheus
      summary: Metrics in Prometheus text format
      description: Operator only.
      security:
        - adminKey: []
      responses:
        '200':
          description: Prometheus exposition text.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/OperatorUnauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/OperatorRateLimited'
  /ops/summary:
    get:
      tags: [Operator]
      operationId: getOpsSummary
      summary: Operator summary
      description: Operator only. Recent logs, settlement sagas, PayPal webhook outcomes and metrics.
      security:
        - adminKey: []
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema:
                type: object
                required: [logs, sagas, paypal, metrics]
                properties:
                  logs:
                    type: array
                    items:
                      type: string
                  sagas:
                    type: array
                    items:
                      type: object
                      required: [auctionId, lotId, state]
                      properties:
                        auctionId:
                          type: string
                        lotId:
                          type: string
                        state:
                          type: string
                  paypal:
                    type: object
                    additionalProperties:
                      type: integer
                  metrics:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/OperatorUnauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/OperatorRateLimited'
  /ops/rooms:
    get:
      tags: [Operator]
      operationId: listOpsRooms
      summary: Rooms the host has loaded
      description: Operator only.
      security:
        - adminKey: []
      responses:
        '200':
          description: Loaded rooms.
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms:
                    type: array
                    items:
                      type: object
                      required: [auctionId, seq, status, connections, mailboxDepth]
                      properties:
                        auctionId:
                          type: string
                        seq:
                          type: integer
                        status:
                          type: string
                        connections:
                          type: integer
                        mailboxDepth:
                          type: integer
              example:
                rooms:
                  - auctionId: 01JC5ZP4M7Q8R9S0T1V2W3X4Y5
                    seq: 12
                    status: OPEN
                    connections: 3
                    mailboxDepth: 0
        '401':
          $ref: '#/components/responses/OperatorUnauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/OperatorRateLimited'
  /ops/auctions/{id}/void-all:
    post:
      tags: [Operator]
      operationId: opsVoidAll
      summary: Void every uncaptured hold of a hammered auction
      description: |
        Operator only. For example while the kill switch keeps a capture waiting. Audited with
        the actor `admin`. 409 `busy` while a settlement run holds the lease, 409
        `no_settlement` before the lot was hammered.
      security:
        - adminKey: []
      parameters:
        - $ref: '#/components/parameters/AuctionId'
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [status, holds]
                properties:
                  status:
                    type: string
                    const: done
                  holds:
                    type: object
                    additionalProperties:
                      type: string
                    description: Hold id to the outcome the payments package recorded.
        '401':
          $ref: '#/components/responses/OperatorUnauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/OperatorConflict'
        '429':
          $ref: '#/components/responses/OperatorRateLimited'
        '500':
          $ref: '#/components/responses/OperatorInternal'
  /ops/auctions/{id}/release-review:
    post:
      tags: [Operator]
      operationId: opsReleaseReview
      summary: Release the holds a settlement review keeps
      description: |
        Operator only. Releases the fallback candidates' holds of a settlement in review.
        409 with `busy`, `no_settlement` or `not_in_review`.
      security:
        - adminKey: []
      parameters:
        - $ref: '#/components/parameters/AuctionId'
      responses:
        '200':
          description: Released.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: released
        '401':
          $ref: '#/components/responses/OperatorUnauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/OperatorConflict'
        '429':
          $ref: '#/components/responses/OperatorRateLimited'
        '500':
          $ref: '#/components/responses/OperatorInternal'
components:
  securitySchemes:
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: >-
        The operator key, set by the person who runs the host. Compared in constant time. Never
        put it in a browser or a public repository. No real value appears in this document.
    auctioneerAuth:
      type: http
      scheme: bearer
      description: >-
        Auctioneer token (12 hours), carried in the auctioneer link fragment. Bound to one
        auction. Revoked by rotation.
    screenAuth:
      type: http
      scheme: bearer
      description: Screen token (12 hours) for the projector page. Read only, no private fields.
    reviewerAuth:
      type: http
      scheme: bearer
      description: >-
        Reviewer token (12 hours), returned by judge-room creation. Read only: the screen's
        view of the snapshot and event log, and the room ledger. Bound to one judge room.
    judgeKey:
      type: apiKey
      in: header
      name: X-Judge-Key
      description: >-
        A limited per-judge key, `gvl_judge_<id>_<secret>` (set by the host operator, never the
        operator key). Only the judge-room create and key-check routes read it; it never opens an
        operator route. It has a room cap and an hourly cap of its own, and an expiry unless it is the
        shared judging key, which does not expire (sandbox only; the operator can revoke it). No
        real value appears in this document.
    sessionAuth:
      type: http
      scheme: bearer
      description: >-
        Session (bidder) token (4 hours) returned by the join routes. Names one bidder in one
        auction.
    receiptAuth:
      type: http
      scheme: bearer
      description: >-
        Receipt token (4 hours) returned by the receipt-link route. Opens only
        GET /api/auctions/{id}/receipt.
  parameters:
    AuctionId:
      name: id
      in: path
      required: true
      description: Auction id.
      schema:
        $ref: '#/components/schemas/Ulid'
    AuctionIdOrCode:
      name: id
      in: path
      required: true
      description: Auction id, or its 6 character join code.
      schema:
        type: string
        examples:
          - 01JC5ZP4M7Q8R9S0T1V2W3X4Y5
          - K7M2QX
    HoldId:
      name: holdId
      in: path
      required: true
      description: Id of the hold, as returned by the create-hold route.
      example: hold_01
      schema:
        type: string
        minLength: 1
  headers:
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
        minimum: 1
  schemas:
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      description: 26 character id (Crockford base 32).
      examples:
        - 01JC5ZP4M7Q8R9S0T1V2W3X4Y5
    EpochMs:
      type: integer
      description: Milliseconds since the Unix epoch.
    Cents:
      type: integer
      minimum: 0
      description: Money in integer US cents. There are no decimals anywhere in the API.
    BidderName:
      type: string
      minLength: 1
      maxLength: 64
      description: >-
        Display name. Control characters, invisible direction marks and angle brackets are
        refused.
    ErrorCode:
      type: string
      enum:
        - bad_message
        - unsupported_version
        - not_joined
        - unauthorized
        - forbidden
        - invite_used
        - rate_limited
        - room_full
        - auction_full
        - room_cap
        - unregistered
        - below_increment
        - over_ceiling
        - below_reserve
        - closed
        - already_leading
        - bad_amount
        - lot_not_open
        - ceiling_revoked
        - unconfirmed
        - not_higher_than_own_max
        - already_bid
        - limit_exceeded
        - auction_paused
        - store_unavailable
        - conflict
        - host_fenced
        - not_found
        - internal
      description: >-
        Stable codes. HTTP status per code: 400 bad_message, unsupported_version, not_joined,
        bad_amount; 401 unauthorized; 403 forbidden, unregistered, ceiling_revoked; 404
        not_found; 409 invite_used, closed, already_leading, lot_not_open, unconfirmed,
        already_bid, auction_paused, conflict, host_fenced; 422 below_increment, over_ceiling,
        below_reserve, not_higher_than_own_max, limit_exceeded (these arise on the socket, in
        `bid_rejected`); 429 rate_limited; 500 internal; 503 room_full, auction_full,
        room_cap, store_unavailable.
    Error:
      type: object
      description: >-
        The error body. The stable code is in `code` on the core routes, in `error` on the
        operator routes and the host-level answers, and in both on the judge routes; the
        hold routes use `error` for hold failures and `code` for authentication and state
        failures. Read `code ?? error`. `message` is present on the core, hold and judge
        routes, and absent on the operator routes and host-level answers. 413 and 415 use
        `bad_message`. See "Errors" in the description for the table per family.
      properties:
        error:
          example: 'order_not_found'
          type: string
          description: Stable code (hold failures, judge, operator and host-level answers, and the 429 of the code lookup and the join route). A plain string; may be a value outside ErrorCode.
        code:
          example: 'bad_message'
          type: string
          description: Stable code (core, judge and hold authentication or state failures). Usually one of ErrorCode; judge, hold and lookup codes are listed in ExtraErrorCode and HoldErrorCode, so treat it as a string.
        message:
          description: Text for a person. Never contains a token or a stack trace.
          example: 'invalid request body'
          type: string
        detail:
          example: 'title: Expected string, received number'
          type: string
          description: 'Optional extra text, for example the failing field path and reason.'
      anyOf:
        - required: [message, code]
        - required: [message, error]
        - required: [error]
      examples:
        - code: bad_message
          message: invalid request body
          detail: 'title: Expected string, received number'
        - error: order_not_found
          message: no such hold
        - error: unauthorized
    ExtraErrorCode:
      type: string
      enum:
        - code_locked
        - judge_join_locked
        - judge_key_invalid
        - judge_key_expired
        - judge_key_revoked
        - judge_key_locked
        - judge_room_full
        - judge_room_ended
        - judge_room_expired
        - judge_rate_limited
        - ledger_unverified
        - method_not_allowed
        - export_failed
        - bad_auction_id
        - bad_kind
        - no_settlement
        - not_in_review
        - busy
        - payments_unsupported
      description: >-
        Codes sent by the judge, operator, export and lookup routes that are not in
        `ErrorCode`: 429 code_locked, judge_join_locked, judge_key_locked, judge_room_full,
        judge_rate_limited; 401 judge_key_invalid, judge_key_expired, judge_key_revoked; 410
        judge_room_ended, judge_room_expired; 409 ledger_unverified, busy, no_settlement,
        not_in_review; 405 method_not_allowed; 400 bad_auction_id, bad_kind; 500
        export_failed; 501 payments_unsupported. The list may grow: do not fail on an unknown
        value.
    HoldErrorCode:
      type: string
      enum:
        - ceiling_out_of_range
        - hold_exists
        - raise_limit_reached
        - raise_too_small
        - order_not_found
        - order_not_approved
        - paypal_unavailable
        - kill_switch_engaged
        - payments_not_sandbox
      description: >-
        400 ceiling_out_of_range (below 100 cents or above the host cap); 404 order_not_found;
        409 hold_exists, raise_limit_reached, order_not_approved; 422 raise_too_small;
        503 paypal_unavailable, kill_switch_engaged, payments_not_sandbox.
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
          description: Always `ok` when the host answers.
    WarmupReport:
      type: object
      required: [ok, elapsedMs, steps]
      properties:
        ok:
          description: True when every warm-up step succeeded.
          example: true
          type: boolean
        elapsedMs:
          description: Total time of the warm-up in milliseconds.
          example: 420
          type: integer
        steps:
          description: One entry per warm-up step, in the order they ran.
          type: array
          items:
            type: object
            required: [name, ok, ms]
            properties:
              name:
                description: Name of the warm-up step.
                example: 'database'
                type: string
              ok:
                description: True when this step succeeded.
                example: true
                type: boolean
              ms:
                description: Time this step took in milliseconds.
                example: 120
                type: integer
    AuctionStatus:
      type: string
      description: Lifecycle state of the auction, from SCHEDULED to DONE.
      enum: [SCHEDULED, OPEN, PAUSED, CLOSING, SETTLING, DONE]
    HoldStatus:
      type: string
      enum: [PENDING_APPROVAL, HELD, CAPTURED, VOIDED, EXPIRED, DENIED, UNKNOWN]
    AuctionConfig:
      type: object
      description: Settings of one auction. Amounts are in cents, durations in milliseconds.
      additionalProperties: false
      required:
        - currency
        - reserve
        - minIncrement
        - endTs
        - softCloseWindowMs
        - softCloseExtensionMs
        - maxExtensions
        - ceilingPresets
        - confirmConfidenceThreshold
      properties:
        mode:
          description: >-
            Bidding mode. Only `english` is accepted; the host refuses any other mode with
            400 `bad_message`. Defaults to english.
          type: string
          enum: [english]
          default: english
        currency:
          description: Currency of every amount. Only USD is accepted.
          type: string
          const: USD
        reserve:
          example: 500
          type: integer
          minimum: 100
          maximum: 99999999999
          description: Reserve price in cents (at least 100, at most 99999999999).
        minIncrement:
          example: 100
          type: integer
          minimum: 1
          maximum: 99999999999
          description: Smallest raise in cents (at most 99999999999).
        endTs:
          description: >-
            End of the lot, in epoch milliseconds. Must be strictly after the host's clock at
            creation and at most 24 hours ahead (400 `bad_message` otherwise). The value in
            the example is a placeholder: use the current time plus a few minutes.
          type: integer
          example: 1893456000000
        softCloseWindowMs:
          example: 30000
          type: integer
          minimum: 0
          maximum: 600000
          description: A bid this close to the end extends the lot.
        softCloseExtensionMs:
          description: How long a soft close extends the lot, in milliseconds.
          example: 30000
          type: integer
          minimum: 0
          maximum: 600000
        maxExtensions:
          description: Most times the lot can be extended by soft close.
          example: 5
          type: integer
          minimum: 0
          maximum: 50
        ceilingPresets:
          example: [1000, 2500, 5000]
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: integer
            minimum: 1
            maximum: 99999999999
          description: >-
            Strictly ascending suggested ceiling amounts in cents, none below the reserve. A
            bidder may choose any ceiling from the minimum to the host cap, so these are
            suggestions, not the only allowed amounts.
        confirmConfidenceThreshold:
          example: 0.8
          type: number
          minimum: 0
          maximum: 1
          description: Spoken bids below this confidence need the bidder to confirm.
        autoHammerDelayMs:
          description: Milliseconds after closing begins before the host hammers the lot by itself. When absent, the auctioneer hammers by hand.
          example: 5000
          type: integer
          minimum: 0
        holdScope:
          description: >-
            One hold covers the whole event. Only `event` is accepted; `lot` is refused with
            400 `bad_message`.
          type: string
          enum: [event]
    CreateAuctionRequest:
      type: object
      additionalProperties: false
      required: [config]
      properties:
        title:
          description: Lot title shown to bidders.
          example: 'Vintage typewriter'
          type: string
          minLength: 1
          maxLength: 120
          default: Untitled auction
        config:
          $ref: '#/components/schemas/AuctionConfig'
        fundraiserGoalCents:
          example: 500000
          type: integer
          minimum: 1
          maximum: 100000000000
          description: Optional goal; the projector shows a thermometer only when it is set.
    CreateAuctionResponse:
      type: object
      required: [auctionId, joinCode, lotTitle, auctioneerLink, screenLink]
      properties:
        auctionId:
          $ref: '#/components/schemas/Ulid'
        joinCode:
          $ref: '#/components/schemas/JoinCode'
        lotTitle:
          description: Title of the lot, as given in the request.
          example: 'Vintage typewriter'
          type: string
        auctioneerLink:
          description: Link to the auctioneer console. The auctioneer token is in the URL fragment.
          type: string
          format: uri
        screenLink:
          description: Link to the projector screen. The screen token is in the URL fragment.
          type: string
          format: uri
    JoinCode:
      type: string
      pattern: '^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{6}$'
      description: Six letters and digits without look-alikes (no 0, O, 1, I, L).
    AuctionPublic:
      type: object
      required: [auctionId, title, status, endTs, bidderCount]
      properties:
        auctionId:
          $ref: '#/components/schemas/Ulid'
        title:
          description: Lot title.
          example: 'Vintage typewriter'
          type: string
        joinCode:
          $ref: '#/components/schemas/JoinCode'
        judgeRoom:
          example: true
          type: boolean
          description: Present and true for a judge room.
        registrationClosed:
          example: false
          type: boolean
          description: Present and true once the room no longer takes registrations.
        stopped:
          example: false
          type: boolean
          description: Present and true once the auctioneer ended the lot.
        status:
          $ref: '#/components/schemas/AuctionStatus'
        endTs:
          $ref: '#/components/schemas/EpochMs'
        bidderCount:
          description: Number of registered bidders.
          example: 3
          type: integer
          minimum: 0
        currentCents:
          $ref: '#/components/schemas/Cents'
          description: Current price in cents; absent until the first accepted bid.
        leaderPaddle:
          example: 7
          type: integer
          minimum: 1
          maximum: 9999
          description: Paddle number of the current leader; absent when there is none.
    ControlRequest:
      type: object
      additionalProperties: false
      required: [controlId, action]
      properties:
        controlId:
          example: 'ctl-0001'
          type: string
          minLength: 1
          maxLength: 64
          description: Idempotency key you mint. The same id with the same action is a repeat.
        action:
          description: The control to apply.
          type: string
          enum: [open, pause, resume, extend, hammer]
        args:
          example: { 'extraMs': 30000 }
          type: object
          additionalProperties:
            type: number
          description: >-
            `extend` needs `extraMs` (whole number, 1 to 600000). `hammer` needs `closeNow: 1`
            while the lot is open.
    ControlResponse:
      type: object
      required: [ok, controlId]
      properties:
        ok:
          description: Always true on success.
          type: boolean
          const: true
        controlId:
          description: The controlId you sent.
          example: 'ctl-0001'
          type: string
        hammer:
          type: object
          additionalProperties: true
          description: The hammer frame, present when the control ended the lot.
    Invite:
      type: object
      required: [bidderId, expiresAt, link]
      properties:
        bidderId:
          $ref: '#/components/schemas/Ulid'
        expiresAt:
          $ref: '#/components/schemas/EpochMs'
        link:
          type: string
          format: uri
          description: Registration link with the invite token in the fragment.
    JoinResponse:
      type: object
      required: [sessionToken, bidderId, wsUrl]
      properties:
        sessionToken:
          type: string
          description: Session token for `Authorization` and for the WebSocket `join` frame.
        bidderId:
          $ref: '#/components/schemas/Ulid'
        wsUrl:
          type: string
          format: uri
          description: WebSocket address, `wss://<host>/ws`.
    JudgeRoom:
      type: object
      required:
        - auctionId
        - joinCode
        - lotTitle
        - auctioneerToken
        - screenToken
        - auctioneerLink
        - screenLink
        - reviewerToken
        - reviewerLink
        - expiresAt
        - biddingEndsAt
      properties:
        auctionId:
          $ref: '#/components/schemas/Ulid'
        joinCode:
          $ref: '#/components/schemas/JoinCode'
        lotTitle:
          description: Title of the lot in the room.
          example: 'Sandbox lot'
          type: string
        auctioneerToken:
          description: Auctioneer token for this room (12 hours). Send it as a bearer token.
          type: string
        screenToken:
          description: Screen token for this room (12 hours). Read only.
          type: string
        auctioneerLink:
          description: Link to the auctioneer console with the token in the URL fragment.
          type: string
          format: uri
        screenLink:
          description: Link to the projector screen with the token in the URL fragment.
          type: string
          format: uri
        reviewerToken:
          type: string
          description: Read-only reviewer token for this room (12 hours).
        reviewerLink:
          type: string
          format: uri
          description: Audit page link with the reviewer token in the fragment.
        expiresAt:
          $ref: '#/components/schemas/EpochMs'
        biddingEndsAt:
          $ref: '#/components/schemas/EpochMs'
        unlocked:
          type: boolean
          const: true
          description: Present and true when the room was made with a valid judge key.
    ReplayBundle:
      type: object
      description: >-
        A verifiable export of the ledger (`packages/shared/src/replay-bundle.ts`). Hash with
        `verifyPublicExport` and compare `headHash`.
      required: [version, exportVersion, auctionId, generatedAt, count, headHash, closed, events]
      properties:
        version:
          description: Version of the bundle format.
          example: 1
          type: integer
        exportVersion:
          description: Version of the export rules used to build the bundle.
          example: 4
          type: integer
        auctionId:
          description: Id of the exported auction.
          example: '01J9ZZ0000000000000000000A'
          type: string
        generatedAt:
          $ref: '#/components/schemas/EpochMs'
        count:
          example: 12
          type: integer
          minimum: 0
          description: Number of events; equals the last event seq.
        headHash:
          type:
            - string
            - 'null'
          description: Hash of the last public event, or null for an empty ledger.
        closed:
          example: true
          type: boolean
          description: >-
            True when the last event closes the auction and names the event before it. False
            means the bundle is open or not anchored. Always present.
        events:
          description: The public events in order, one object per event.
          type: array
          items:
            type: object
            additionalProperties: true
    CreateHoldResponse:
      type: object
      required: [holdId, orderId]
      properties:
        holdId:
          description: Id of the hold on this host.
          example: 'hold_01'
          type: string
        orderId:
          description: PayPal sandbox order id for the hold.
          example: '5O190127TN364715T'
          type: string
        approveUrl:
          type: string
          format: uri
          description: PayPal's own approval page, for when the popup cannot open.
    RoomEvent:
      type: object
      description: >-
        One logged event. `seq` is always there. The other fields depend on `type`
        (`auction_created`, `bidder_registered`, `ceiling_raised`, `bid_accepted`, `control`,
        `state_changed`, `hammered` and others); a screen sees only `seq` for non-public types.
      required: [seq]
      properties:
        seq:
          description: Position of the event in the ledger, starting at 1.
          example: 1
          type: integer
          minimum: 1
        type:
          description: Event type, for example auction_created or bid_accepted. Absent for non-public events seen by a screen.
          example: 'auction_created'
          type: string
      additionalProperties: true
    RoomSnapshot:
      type: object
      description: >-
        Room state for one viewer. Fields not listed here may appear; clients must ignore what
        they do not know. Private fields (`you`, `yourHold`, ceilings) appear only for the
        bidder they belong to.
      required: [auctionId, config, status, price, leaderId, endTs, minNext, roster, recentAudit]
      properties:
        auctionId:
          $ref: '#/components/schemas/Ulid'
        config:
          $ref: '#/components/schemas/AuctionConfig'
        status:
          $ref: '#/components/schemas/AuctionStatus'
        price:
          description: Current price in cents, or null before the first accepted bid.
          oneOf:
            - $ref: '#/components/schemas/Cents'
            - type: 'null'
        leaderId:
          description: Bidder id of the current leader, or null when there is none.
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        endTs:
          $ref: '#/components/schemas/EpochMs'
        minNext:
          $ref: '#/components/schemas/Cents'
        paused:
          description: True while the auctioneer has paused the lot.
          example: false
          type: boolean
        remainingMs:
          description: Milliseconds left until the lot ends.
          example: 45000
          type: integer
          minimum: 0
        stopped:
          description: True once the auctioneer used the Stop button.
          example: false
          type: boolean
        registrationClosed:
          description: True once the room no longer takes registrations.
          example: false
          type: boolean
        hammer:
          description: Result of the lot, present once it was hammered.
          type: object
          required: [winnerId, price]
          properties:
            winnerId:
              description: Bidder id of the winner, or null when the lot did not sell.
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            price:
              $ref: '#/components/schemas/Cents'
        lotTitle:
          description: Title of the lot (at most 120 characters). Set by the HTTP snapshot route.
          example: 'Vintage typewriter'
          type: string
          maxLength: 120
        maxCeilingCents:
          description: >-
            The most one bidder may hold as a limit in this room (the host cap), so a limit
            picker never offers an amount the host refuses. Absent on older hosts.
          example: 100000
          type: integer
          minimum: 0
        joinCode:
          description: Short join code of the auction, 4 to 12 characters (the host mints 6). Set by the HTTP snapshot route.
          type: string
          minLength: 4
          maxLength: 12
          example: K7M2QX
        fundraiser:
          description: Fundraiser goal, present only when one was set.
          type: object
          required: [goalCents]
          properties:
            goalCents:
              description: Goal in cents.
              example: 500000
              type: integer
              minimum: 1
        roster:
          description: Registered bidders, at most 200.
          type: array
          maxItems: 200
          items:
            type: object
            required: [bidderId, paddle, name, hold]
            properties:
              bidderId:
                $ref: '#/components/schemas/Ulid'
              paddle:
                description: Paddle number of the bidder.
                example: 7
                type: integer
                minimum: 1
                maximum: 9999
              name:
                description: Display name of the bidder.
                example: 'Bidder 7'
                type: string
              hold:
                description: HELD when the bidder has a hold, otherwise NONE.
                type: string
                enum: [HELD, NONE]
        recentAudit:
          description: The most recent audit rows visible to this viewer, at most 50.
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: true
        settlement:
          description: Settlement progress, present once the lot ended.
          type: object
          additionalProperties: false
          required: [rev, auctionState]
          properties:
            rev:
              description: Revision counter of the settlement; it grows with every change.
              example: 3
              type: integer
            auctionState:
              description: State of the settlement of the lot.
              type: string
              enum:
                - HELD
                - BIDDING
                - WINNER_SELECTED
                - CAPTURING
                - CAPTURED
                - VOIDING
                - SETTLED
                - FALLBACK_RUNNER_UP
                - FAILED_NEEDS_REVIEW
            you:
              description: The viewing bidder's own settlement state. Bidder sessions only.
              type: string
              enum:
                - HELD
                - BIDDING
                - WINNER_SELECTED
                - CAPTURING
                - CAPTURED
                - VOIDING
                - SETTLED
                - FALLBACK_RUNNER_UP
                - FAILED_NEEDS_REVIEW
            yourHold:
              description: The viewing bidder's own hold after the hammer. Never sent to screens, the auctioneer or other bidders.
              type: object
              additionalProperties: false
              required:
                [bidderId, idSuffix, status, ceilingCents, capturedCents, releasedCents, remainder]
              properties:
                bidderId:
                  $ref: '#/components/schemas/Ulid'
                idSuffix:
                  description: Last 6 characters of the hold id only.
                  example: 9K0M1A
                  type: string
                  maxLength: 6
                status:
                  description: Status of the hold.
                  type: string
                  enum: [PENDING_APPROVAL, HELD, CAPTURED, VOIDED, EXPIRED, DENIED, UNKNOWN]
                ceilingCents:
                  $ref: '#/components/schemas/Cents'
                capturedCents:
                  description: Cents captured from the hold (sandbox only).
                  example: 0
                  type: integer
                  minimum: 0
                releasedCents:
                  description: Cents of the hold released.
                  example: 0
                  type: integer
                  minimum: 0
                remainder:
                  description: What happened to the part of a captured hold beyond the price.
                  type: string
                  enum: [none, pending, released, unreleased]
        you:
          description: The viewing bidder's own ceiling and high bid. Bidder sessions only.
          type: object
          additionalProperties: false
          required: [bidderId, ceiling]
          properties:
            bidderId:
              $ref: '#/components/schemas/Ulid'
            ceiling:
              $ref: '#/components/schemas/Cents'
            highBid:
              description: This bidder's highest accepted amount, absent before their first accepted bid.
              allOf:
                - $ref: '#/components/schemas/Cents'
      additionalProperties: true
    StateFrame:
      type: object
      description: The `state` frame of the WebSocket protocol, returned over HTTP.
      required: [v, t, snapshot]
      properties:
        v:
          description: Protocol version of the frame.
          type: integer
          const: 1
        t:
          description: Frame type. Always state.
          type: string
          const: state
        seq:
          description: Sequence number of the last event the snapshot includes.
          example: 12
          type: integer
        ts:
          description: Host clock when the frame was built (every server frame carries it).
          allOf:
            - $ref: '#/components/schemas/EpochMs'
        snapshot:
          $ref: '#/components/schemas/RoomSnapshot'
      additionalProperties: true
  responses:
    BadRequest:
      description: >-
        The body, query or path is not valid (`bad_message`). `detail` lists the failing fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: bad_message
            message: invalid request body
            detail: 'config.reserve: reserve must be at least 100 cents'
    OperatorBadRequest:
      description: A bad query on an operator route (`bad_auction_id`, `bad_kind`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: bad_auction_id
    Unauthorized:
      description: The credential is missing, expired, revoked, of the wrong kind or for another auction.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthorized
            message: access token required
    Forbidden:
      description: >-
        The credential is valid but its role may not do this (`forbidden`). On a write sent
        from a browser origin the host does not allow, the same code answers "origin not
        allowed" (see `OriginForbidden`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: forbidden
            message: not allowed
    OriginForbidden:
      description: >-
        A cross-origin write (POST or DELETE with an `Origin` header) from an origin the host
        does not allow is refused before the handler runs (`forbidden`, "origin not allowed").
        Allowed are the operator's web origins; the docs origin
        (`https://docs.gavel.dualmindlab.tech`) is allowed only on the judge-room, control and
        receipt routes listed in the CORS section. Callers that send no `Origin` header are
        not affected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: forbidden
            message: origin not allowed
    Unavailable:
      description: >-
        The host cannot serve the request now: the room cannot reach its store
        (`store_unavailable`), or a host limit is reached (`room_cap`, `room_full`,
        `auction_full`). Safe to retry after a short wait.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: store_unavailable
            message: the room cannot reach its store
    OperatorUnauthorized:
      description: >-
        The operator key or token is missing or wrong. Operator routes send `{"error": "unauthorized"}` only.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
    OperatorNotFound:
      description: >-
        No such auction or route. Operator routes send `{"error": "not_found"}` only.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
    OperatorRateLimited:
      description: >-
        The per-address limit of the host answered before the route ran. The body is
        `{"error": "rate_limited"}` only. Wait `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: rate_limited
    OperatorInternal:
      description: >-
        A read or a payments call failed (`internal` from the host, `export_failed` from the
        export routes). The body is `{"error": "<code>"}` only.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal
    ReplayLedgerUnverified:
      description: >-
        The hash chain of the ledger does not verify (`ledger_unverified`). The body is `{"error": "ledger_unverified"}` only.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: ledger_unverified
    NotFound:
      description: No such auction, bidder, room or route (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: no such auction
    MethodNotAllowed:
      description: Wrong method for a route the host serves directly. The `Allow` header names the right one.
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: method_not_allowed
    Conflict:
      description: >-
        The request conflicts with the state of the lot or the credential: `conflict` (for
        example a hammer refused because the price or leader changed, an auction that already
        exists, or a concurrent change), `closed`, `invite_used`, `lot_not_open`, or
        `host_fenced` when another host instance owns the room.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: conflict
            message: The lot has already ended
    OperatorConflict:
      description: A settlement run holds the lease (`busy`), there is no settlement (`no_settlement`) or the settlement is not in review (`not_in_review`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: busy
    JudgeKeyInvalid:
      description: >-
        The judge key was not accepted (`judge_key_invalid`), it has expired
        (`judge_key_expired`), it was revoked (`judge_key_revoked`), or the host has none set.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: judge_key_invalid
            code: judge_key_invalid
            message: That key was not accepted.
    Gone:
      description: The judge room ended (`judge_room_expired` or `judge_room_ended`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: judge_room_ended
            code: judge_room_ended
            message: That room has ended
    PayloadTooLarge:
      description: The body is larger than 64 KiB (`bad_message`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: bad_message
            message: request body too large
    UnsupportedMediaType:
      description: A body was sent that is not `application/json` (`bad_message`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: bad_message
            message: content-type must be application/json
    RateLimited:
      description: >-
        Too many requests (`rate_limited`), a locked-out source (`code_locked`,
        `judge_join_locked`), a full judge room (`judge_room_full`), or a judge-room cap or
        create limit. Wait `Retry-After` seconds. The body carries `message` on the routes
        that build it; the host-wide per-address limiter answers `{"error": "rate_limited"}`
        only, so read `code ?? error`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: rate_limited
            message: Too many tries. Wait a minute and try again.
    Internal:
      description: Something failed on the host (`internal`). The message never carries internals.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: internal
            message: internal error
    Revoked:
      description: Revoked.
      content:
        application/json:
          schema:
            type: object
            required: [revoked]
            properties:
              revoked:
                type: boolean
                const: true
          example:
            revoked: true
    HoldBadRequest:
      description: >-
        Invalid body (`bad_message`) or a ceiling below the minimum of 100 cents or above the
        host cap (`ceiling_out_of_range`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: ceiling_out_of_range
            message: ceiling 50 is below the minimum of 100
    HoldNotFound:
      description: No such hold, or it belongs to another bidder (`order_not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: order_not_found
            message: no such hold
    HoldConflict:
      description: A hold already exists or is authorized (`hold_exists`), the raises of the limit are used up (`raise_limit_reached`), the order is not approved yet (`order_not_approved`) or the auction no longer takes holds (`closed`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: order_not_approved
            message: the order is not approved
    RaiseTooSmall:
      description: The raise adds less than the minimum step, $1 or 5 percent of the current limit (`raise_too_small`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: raise_too_small
            message: the raise is below the minimum step
    HoldUnavailable:
      description: PayPal is unreachable (`paypal_unavailable`), the kill switch is on (`kill_switch_engaged`) or the host is not in sandbox mode (`payments_not_sandbox`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: paypal_unavailable
            message: PayPal is not reachable
