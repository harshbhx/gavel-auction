  /api/auctions/{id}/bidders/{bidderId}/invite:
    post:
      tags: [Bidding access]
      operationId: reissueInvite
      summary: Re-issue an invite for an existing bidder
      description: |
        Auctioneer token only. A bidder who lost their tab gets a fresh single-use invite for
        the same bidder id, so their hold and bids stay theirs. Answers 404 for a bidder who
        has no hold in the room.
      security:
        - auctioneerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuctionId'
        - name: bidderId
          in: path
