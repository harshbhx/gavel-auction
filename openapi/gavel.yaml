  /api/auctions/{id}/snapshot:
    get:
      tags: [Read]
      operationId: getSnapshot
      summary: Room snapshot for the caller's role
      description: |
        The same snapshot the WebSocket sends in a `state` frame, filtered by role: a bidder
        sees only their own ceiling and hold, a screen sees no private fields, the auctioneer
        sees the full audit rows. A reviewer token gets the screen's view.
      security:
        - auctioneerAuth: []
        - screenAuth: []
        - sessionAuth: []
        - reviewerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuctionId'
      responses:
        '200':
          description: The state frame.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateFrame'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/auctions/{id}/events:
    get:
      tags: [Read]
      operationId: listEvents
      summary: Page through the event log
      description: |
        Auctioneer, screen or reviewer token (a reviewer sees what a screen sees). Events after sequence `after`, at most `limit`. A screen
        sees full rows only for public event types; every other event is a bare `{seq}` so the
        log stays whole. Ceilings, transcripts, hold references and the auctioneer subject are
        never returned. Pass `next` back as `after` to continue.
      security:
        - auctioneerAuth: []
        - screenAuth: []
        - reviewerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuctionId'
        - name: after
          in: query
          description: Return events after this sequence number. Pass the `next` of the previous page to continue.
          example: 0
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Most events to return in one page.
          example: 100
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: A page of events.
          content:
            application/json:
              schema:
                type: object
                required: [events, next]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoomEvent'
                  next:
                    type: integer
                    minimum: 0
              example:
                events:
                  - seq: 1
                    type: auction_created
                next: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/auctions/{id}/receipt-link:
    post:
      tags: [Receipts]
      operationId: createReceiptLink
      summary: Make a shareable receipt link
      description: |
        Session token only. Returns a receipt token (valid 4 hours) that opens exactly one
        read-only route, `GET /api/auctions/{id}/receipt`, for this bidder.
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/AuctionId'
      responses:
        '200':
          description: Receipt link.
