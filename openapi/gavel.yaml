            application/json:
              schema:
                type: object
                required: [token, link, expiresAt]
                properties:
                  token:
                    type: string
                  link:
                    type: string
                    format: uri
                  expiresAt:
                    $ref: '#/components/schemas/EpochMs'
              example:
                token: RECEIPT_TOKEN
                link: https://gavel-web.example/r/01JC5ZP4M7Q8R9S0T1V2W3X4Y5/receipt#token=RECEIPT_TOKEN
                expiresAt: 1767240000000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/auctions/{id}/receipt:
    get:
      tags: [Receipts]
      operationId: getReceipt
      summary: Read a receipt
      description: |
        Receipt token only. A cut-down snapshot: the lot, the hammer outcome, the viewer's own
        roster row and own hold. The winner keeps a paddle but loses the name, every other
        bidder is dropped, and the ceiling, the join code and the audit rows are removed.
      security:
        - receiptAuth: []
      parameters:
        - $ref: '#/components/parameters/AuctionId'
      responses:
        '200':
          description: The receipt.
