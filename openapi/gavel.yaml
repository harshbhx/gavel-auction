          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '201':
          description: New invite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
