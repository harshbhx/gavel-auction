# Spectral ruleset for openapi/gavel.yaml, run by .github/workflows/openapi-lint.yml.
# Redocly (openapi/redocly.yaml) stays the gate in ci.yml; Spectral adds the description,
# example and tag checks that API import tools such as APIMatic score.
extends:
  - spectral:oas
rules:
  oas3-api-servers: error
  operation-description: warn
  operation-tag-defined: error
  info-contact: warn
  info-description: error
  tag-description: warn
  # Import tools score undocumented fields and parameters, so ask for a description on each.
  gavel-property-description:
    description: Every inline schema property needs a description.
    severity: warn
    given: "$.components.schemas..properties[*]"
    then:
      field: description
      function: truthy
  gavel-parameter-description:
    description: Every inline parameter needs a description.
    severity: warn
    given: "$.paths..parameters[*]"
    then:
      field: description
      function: truthy
