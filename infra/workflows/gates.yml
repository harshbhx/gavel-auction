# Sandbox gates and measurement (PAY-66, R-PAY-140, R-PAY-145).
# Install: copy to .github/workflows/gates.yml.
#
# The PayPal sandbox secrets are read only here, in two jobs that run from the main branch
# and sit behind the `sandbox-nightly` environment (branch limited, reviewer required). Code
# from a pushed branch or a pull request can never read them. payments-ci.yml has no secrets.
name: gates

on:
  workflow_dispatch:
    inputs:
      gate:
        description: Which script to run
        type: choice
        required: true
        options:
          - g1
          - idem
          - measure
      resume_run:
        description: Optional run id of an earlier run that paused for buyer approval (exit code 3)
        type: string
        required: false
  # The G3 timed probe (schedule) is added back together with the gate:g3 script.

permissions:
  contents: read

jobs:
  manual:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: sandbox-nightly
    permissions:
      contents: read
      actions: read
    concurrency:
      group: gates-manual
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Fetch the run file of the paused run
        if: ${{ inputs.resume_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: gh run download "$RESUME_RUN" --name gate-evidence --dir docs/evidence
      - name: Run the gate
        env:
          GATE: ${{ inputs.gate }}
          GATE_CURRENCY: INR
          RESUME_RUN: ${{ inputs.resume_run }}
          PAYPAL_ENV: sandbox
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
        run: |
          case "$GATE" in
            g1) script=gate:g1 ;;
            idem) script=gate:idem ;;
            measure) script=measure ;;
            *) echo "unknown gate: $GATE"; exit 2 ;;
          esac
          resume=$(find docs/evidence -name '*.run.json' 2>/dev/null | sort | tail -1)
          if [ -n "$resume" ] && [ -n "$RESUME_RUN" ]; then
            npm run "$script" -w @gavel/payments -- --resume "$PWD/$resume" --out "$PWD/docs/evidence"
          else
            npm run "$script" -w @gavel/payments -- --out "$PWD/docs/evidence"
          fi
      # Evidence is uploaded even when the script paused (exit code 3) or failed.
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-evidence
          path: docs/evidence
          if-no-files-found: warn
          retention-days: 90
