# Payments CI (PAY-66, R-PAY-151). No secrets here: this workflow runs code from pull requests.
# Install: copy to .github/workflows/payments-ci.yml. It is kept under infra/ until the
# quality owner has reviewed it, because every file under .github/ is owned by that area.
name: payments-ci

on:
  pull_request:
    paths:
      - 'packages/payments/**'
      - 'package.json'
      - 'package-lock.json'
      - 'infra/workflows/payments-ci.yml'
      - '.github/workflows/payments-ci.yml'
  push:
    branches: [main]
    paths:
      - 'packages/payments/**'

permissions:
  contents: read

concurrency:
  group: payments-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run typecheck -w @gavel/payments
      - run: npm run check:deps -w @gavel/payments

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run test -w @gavel/payments

  # The gate scripts must keep working against the fake (R-PAY-140). They run with the
  # loopback fake server only; the sandbox guard refuses any other host.
  gates-fake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAYPAL_ENV: sandbox
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Measurement script against the fake
        run: npm run measure -w @gavel/payments -- --fake --out "$RUNNER_TEMP/evidence"
      - name: Idempotency probe against the fake
        run: npm run gate:idem -w @gavel/payments -- --fake --out "$RUNNER_TEMP/evidence"
