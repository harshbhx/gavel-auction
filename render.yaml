# Render blueprint for the single Node host (D-0006, D-0018).
# The stores are files owned by one process, so the service keeps one instance and
# its data directory sits on a persistent disk. Without the disk a redeploy wipes
# the room log, ledger, journals and holds.
services:
  - type: web
    name: gavel-host
    runtime: node
    plan: starter
    numInstances: 1
    # vite-node is a dev dependency and NODE_ENV=production would skip it, so ask for dev packages.
    buildCommand: npm ci --include=dev
    startCommand: npm start -w @gavel/server
    healthCheckPath: /healthz
    # Deploys come from .github/workflows/deploy-staging.yml through the deploy hook, not from pushes.
    autoDeploy: false
    disk:
      name: gavel-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: STORE
        value: file
      - key: DATA_DIR
        value: /var/data
      - key: PAYMENTS
        value: sandbox
      - key: PAYPAL_ENV
        value: sandbox
      # The public https URL of this service; set it in the dashboard after the first deploy.
      - key: PUBLIC_URL
        sync: false
      # Comma separated origins of the hosted web app, for example the Pages URL.
      - key: CORS_ORIGINS
        sync: false
      - key: TOKEN_SECRET
        sync: false
      - key: ADMIN_KEY
        sync: false
      # PAYMENTS=sandbox needs the PayPal sandbox app credentials (config.ts refuses to boot without).
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
