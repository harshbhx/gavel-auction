# Render blueprint for the single Node host (D-0006, D-0018).
# The stores are files owned by one process, so the service keeps one instance and
# its data directory sits on a persistent disk. Without the disk a redeploy wipes
# the room log, ledger, journals and holds.
services:
  - type: web
    name: gavel-host
    runtime: node
    plan: starter
    numInstances: 1
    # esbuild (build only) is a dev dependency and NODE_ENV=production would skip it, so ask for
    # dev packages at build time. Install scripts stay off because the service secrets are in the
    # build environment; esbuild ships its binary through optional packages and needs no script.
    # The runtime is plain node on the bundled dist/main.js.
    buildCommand: npm ci --include=dev --ignore-scripts && npm run build -w @gavel/server
    startCommand: npm run start:prod -w @gavel/server
    healthCheckPath: /healthz
    # Deploys come from .github/workflows/deploy-staging.yml through the deploy hook, not from pushes.
    autoDeploy: false
    disk:
      name: gavel-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # Render's own Cloudflare edge and Render's proxy are two hops in front of the app, so the
      # client is the second entry from the right of X-Forwarded-For. Verified once on 9 Nov 2026
      # (docs/evidence/security/SEC-14/). Use 1 only behind a single proxy.
      - key: TRUSTED_PROXY_HOPS
        value: '2'
      - key: STORE
        value: file
      - key: DATA_DIR
        value: /var/data
      - key: PAYMENTS
        value: sandbox
      - key: PAYPAL_ENV
        value: sandbox
      # The public https URL of this service; set it in the dashboard after the first deploy.
      - key: PUBLIC_URL
        sync: false
      # Comma separated origins of the hosted web app, for example the Pages URL. Bare origins only
      # (scheme and host, no path or wildcard); a bad entry stops the boot.
      - key: CORS_ORIGINS
        sync: false
      # Origin of the web app (for example the Worker URL). Links the API builds use it; PUBLIC_URL is
      # the API host and has no pages. Left empty, the first CORS_ORIGINS entry is used.
      - key: WEB_ORIGIN
        sync: false
      - key: TOKEN_SECRET
        sync: false
      - key: ADMIN_KEY
        sync: false
      # Optional limited key for judges (32+ random characters, never the ADMIN_KEY). The judge
      # panel offers a key field only while this is set. Share it in the slide deck only.
      - key: JUDGE_KEY
        sync: false
      # PAYMENTS=sandbox needs the PayPal sandbox app credentials (config.ts refuses to boot without).
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
