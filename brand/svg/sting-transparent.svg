<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="GAVEL logo animation"><title>GAVEL logo sting, the mallet G</title><style>
.ring{stroke-dasharray:1;animation:draw .8s cubic-bezier(.5,0,.2,1) 0s both}
.mallet{transform-origin:0 0;animation:strike 1.4s linear .35s both}
.shock{fill:none;stroke:#ff6a1f;stroke-width:4;transform-box:fill-box;transform-origin:50% 50%;animation:shock .8s cubic-bezier(.1,.6,.3,1) 1.3s both}
.shock2{animation-delay:1.42s;stroke-width:1.5}
.glyph{transform-box:fill-box;transform-origin:50% 50%;animation:jolt .4s ease-out 1.3s both}
.l{animation:in .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(1.55s + var(--i)*.08s)}
.rule{transform-box:fill-box;transform-origin:50% 50%;animation:wipe .6s cubic-bezier(.6,0,.2,1) 2.1s both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes strike{0%{transform:rotate(40deg);opacity:0;animation-timing-function:ease-out}
 22%{transform:rotate(12deg);opacity:1;animation-timing-function:ease-in-out}
 58%{transform:rotate(12deg);animation-timing-function:cubic-bezier(.7,0,1,.6)}
 66%{transform:rotate(0deg)}100%{transform:rotate(0deg);opacity:1}}
@keyframes shock{0%{opacity:0;transform:scale(.5)}10%{opacity:1}100%{opacity:0;transform:scale(2.6)}}
@keyframes jolt{0%{transform:scale(1)}30%{transform:scale(.955)}100%{transform:scale(1)}}
@keyframes in{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:translateX(0)}}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(250.00 67.00) scale(1.4000)"><circle class="shock" cx="50" cy="50" r="46"/><circle class="shock shock2" cx="50" cy="50" r="46"/><g class="glyph"><path class="ring" pathLength="1" d="M78.98 23.90A39 39 0 1 0 89.00 50.00" fill="none" stroke="#1d1712" stroke-width="22"/><g transform="translate(100 50)"><g class="mallet"><rect x="-60" y="-6.5" width="60" height="13" fill="#1d1712"/><rect x="-68" y="-17" width="16" height="34" rx="3" fill="#ff6a1f"/></g></g></g></g><g transform="translate(179.88 231.00) scale(0.6200)"><g class="l" style="--i:0"><g transform="translate(0.00 0)"><path d="M80.10 22.90A40.5 40.5 0 1 0 90.50 50.00" fill="none" stroke="#1d1712" stroke-width="19"/><rect x="41.0" y="44.50" width="59.0" height="11" fill="#1d1712"/><rect x="34" y="35.00" width="14" height="30" rx="3" fill="#ff6a1f"/></g></g><g class="l" style="--i:1"><g transform="translate(112.00 0)"><path d="M0.00 100.00L39.50 0.00L56.50 0.00L96.00 100.00L77.00 100.00L67.52 76.00L28.48 76.00L19.00 100.00ZM48.00 26.58L61.20 60.00L34.80 60.00Z" fill="#1d1712" fill-rule="evenodd"/></g></g><g class="l" style="--i:2"><g transform="translate(206.00 0)"><path d="M0.00 0.00L19.00 0.00L48.00 73.42L77.00 0.00L96.00 0.00L56.50 100.00L39.50 100.00Z" fill="#1d1712" fill-rule="evenodd"/></g></g><g class="l" style="--i:3"><g transform="translate(316.00 0)"><path d="M0.00 0.00L64.00 0.00L64.00 16.00L19.00 16.00L19.00 42.00L56.00 42.00L56.00 58.00L19.00 58.00L19.00 84.00L64.00 84.00L64.00 100.00L0.00 100.00Z" fill="#1d1712" fill-rule="evenodd"/></g></g><g class="l" style="--i:4"><g transform="translate(394.00 0)"><path d="M0.00 0.00L19.00 0.00L19.00 84.00L58.00 84.00L58.00 100.00L0.00 100.00Z" fill="#1d1712" fill-rule="evenodd"/></g></g></g><rect class="rule" x="179.88" y="307.00" width="280.24" height="3" fill="#ff6a1f"/></svg>
